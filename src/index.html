<title>Хроника Монет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Monocraft';src:url(assets/font-regular.woff) format('woff');font-weight:100 500;font-style:normal;font-display:swap}
@font-face{font-family:'Monocraft';src:url(assets/font-bold.woff) format('woff');font-weight:600 900;font-style:normal;font-display:swap}
/* Layout: one narrow column, bottom tab bar, bottom sheets for input. Single dark world by choice. */
:root{
  --bg:#15121b;--panel:#1f1b28;--panel2:#292337;--line:#3d3552;--shadow:#0b090f;
  --ink:#ece4d2;--mute:#a199b3;
  --gold:#e2b24a;--gold-d:#9c7422;
  --inc:#86b863;--exp:#d0605a;
  --display:'Monocraft',ui-monospace,'Courier New',monospace;
  --body:'Monocraft',ui-monospace,'Courier New',monospace;
  --num:'Monocraft',ui-monospace,'Courier New',monospace;
  --panel-a:rgba(31,27,40,.94);--tint:#201a3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html,body{touch-action:manipulation}
.mbtn,.tab .ti,.plus,.bi{font-family:system-ui,'Segoe UI Symbol',sans-serif}
body{padding-top:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 8px)!important}
body.lock{overflow:hidden}
#bgfx{position:fixed;left:0;top:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:1}
.bgp{position:absolute;top:0;image-rendering:pixelated;background-size:100% 100%;opacity:.38;will-change:transform;animation:bgfall linear infinite}
@keyframes bgfall{0%{transform:translate3d(0,-10vh,0) rotate(0deg)}50%{transform:translate3d(28px,55vh,0) rotate(180deg)}100%{transform:translate3d(-14px,112vh,0) rotate(360deg)}}
body.calm #bgfx{display:none}
@media (prefers-reduced-motion:reduce){#bgfx{display:none}}
.scrim{overscroll-behavior:contain;touch-action:none}
.sheet{overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--tint) 0,transparent 440px);background-repeat:no-repeat;color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;font-synthesis:none;font-size:16px;line-height:1.5;margin:0;text-wrap:balance;letter-spacing:0}
p{margin:0}
#app{max-width:480px;margin:0 auto;padding-block:16px 130px;display:flex;flex-direction:column;gap:14px;min-width:0}
body.calm *{animation:none!important}
body.calm .f2{display:none}
body[data-tab="home"]{--tint:#1f1b3d}
body[data-tab="list"]{--tint:#2e2218}
body[data-tab="stats"]{--tint:#172046}
body[data-tab="wallet"]{--tint:#33270f}
body[data-tab="plan"]{--tint:#172046}
body[data-tab="hero"]{--tint:#1f1b3d}
.scene{position:relative;height:118px;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);overflow:hidden;background:var(--panel2)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .cap{position:absolute;left:0;bottom:0;max-width:78%;padding:6px 14px 6px 12px;background:rgba(21,18,27,.88);border-top:2px solid var(--line);border-right:2px solid var(--line)}
.scene .cap h1{font-size:16px;color:var(--gold);line-height:1.4}
.scene .cap .loc{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.scene .r{position:absolute;right:0;top:0;max-width:60%;padding:4px 10px;background:rgba(21,18,27,.84);border-left:2px solid var(--line);border-bottom:2px solid var(--line);font:600 12px var(--num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.card{background:var(--panel-a);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px;min-width:0}
.card h2{font-size:16px;margin-bottom:12px}
.label{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.big{font:700 32px/1.1 var(--num);font-variant-numeric:tabular-nums;margin-top:4px}
.neg{color:var(--exp)}.pos{color:var(--inc)}
.sub{font-size:14px;color:var(--mute);margin-top:6px}
.btn{font:600 15px var(--body);border:2px solid var(--gold-d);background:var(--gold);color:#271c06;padding:11px 14px;min-height:46px;
  box-shadow:0 4px 0 var(--gold-d);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:var(--panel2);color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 1px 0 var(--shadow)}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px}
.btn.danger{background:#5a2420;border-color:#8a3a33;color:#ffd9d4;box-shadow:0 4px 0 #2d100e}
.btn[disabled]{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.actions{display:grid;gap:10px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero-art{background:var(--panel2);border:2px solid var(--line);padding:6px;display:flex;justify-content:center}
.hero-art svg{display:block;width:104px;height:auto;animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.hero-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.lvl{font:400 16px/1.4 var(--display);color:var(--gold)}
.n{font-family:var(--num);font-weight:700}
.lvbig{text-align:center;font:400 24px/1.4 var(--display);color:var(--gold)}
.name{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:var(--panel2);border:2px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--gold);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.22) 6px 8px)}
.xpline{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.ic{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.ic svg{display:block}
.streak{display:flex;flex-direction:column;gap:3px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--panel2);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.list>.row:first-child{border-top:0}
.row .tile{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);font-size:20px}
.row .mid{flex:1;min-width:0}
.row .t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .t2{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font:600 15px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:6px 0 2px}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fc{background:var(--panel2);border:2px solid var(--line);padding:6px 11px;font-size:13px;cursor:pointer;min-height:34px}
.fc.on{border-color:var(--gold);color:var(--gold)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--mute);font:10px var(--body)}
.b-inc{fill:var(--inc)}.b-exp{fill:var(--exp)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel2);border:2px solid var(--line);padding:10px;min-width:0}
.kpi b{display:block;font:700 17px var(--num);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.catrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0}
.catrow .bar{grid-column:1/-1;height:10px}
.catrow .bar>i{background:var(--exp);background-image:none}
.empty{color:var(--mute);padding:14px 0;text-align:center;font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:4px;width:100%;max-width:480px}
.tab{background:none;border:0;color:var(--mute);font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:12px 0 8px;cursor:pointer}
.tab[aria-current="true"]{color:var(--gold)}
.plus{justify-self:center;width:54px;height:54px;margin-top:-22px;background:var(--gold);color:#271c06;border:2px solid var(--gold-d);
  box-shadow:0 4px 0 var(--gold-d);font:700 30px var(--body);cursor:pointer;line-height:1}
.plus:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,6,12,.74);display:flex;align-items:flex-end;justify-content:center;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.scrim.mid{align-items:center;padding:16px}
.sheet{background:var(--panel);border:2px solid var(--line);border-bottom:0;width:100%;max-width:480px;max-height:92%;overflow:auto;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.scrim.mid .sheet{border-bottom:2px solid var(--line);box-shadow:6px 6px 0 var(--shadow);max-height:88%}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h2{font-size:16px}
.x{background:var(--panel2);border:2px solid var(--line);width:38px;height:38px;font-size:22px;cursor:pointer;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--line)}
.seg button{background:var(--panel2);border:0;padding:10px 4px;cursor:pointer;font-weight:600;min-height:44px}
.seg button.on{background:var(--gold);color:#271c06}
.amtwrap{display:flex;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:0 14px}
.amount{flex:1;min-width:0;width:100%;background:none;border:0;font:700 40px var(--num);padding:10px 0;text-align:right;font-variant-numeric:tabular-nums}
.amtwrap span{font:700 28px var(--num);color:var(--gold);margin-left:8px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:2px solid var(--line);padding:8px 4px;font-size:12px;cursor:pointer;min-height:68px;min-width:0}
.cat .ci{font-size:24px;line-height:1.2}
.cat span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.on{border-color:var(--gold);background:#352d1c}
.cat.dashed{border-style:dashed;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--mute)}
.inp{background:var(--panel2);border:2px solid var(--line);padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea.inp{min-height:90px;resize:vertical;font:12px/1.4 ui-monospace,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--exp);font-size:13px}
.note{font-size:14px;color:var(--mute)}
.gear{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.gear .g{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 10px;min-height:40px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);cursor:pointer}
.gear .g.on{border-color:var(--gold);color:var(--gold);background:#352d1c}
.gear .g.lock{color:var(--mute);opacity:.6;cursor:default}
.slot{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.herobig{display:flex;justify-content:center;background:var(--panel2);border:2px solid var(--line);padding:10px}
.herobig svg{width:150px;height:auto}
#toast{position:fixed;left:50%;top:calc(12px + max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,440px);
  background:var(--ink);color:#1b1722;padding:10px 14px;font-weight:600;font-size:14px;box-shadow:4px 4px 0 var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
.dadv{font-size:14px;line-height:1.45;margin:6px 0;padding-left:10px;border-left:3px solid var(--gold-d)}
textarea.inp[readonly]{font-size:12px;line-height:1.4}
.fch{font:700 16px var(--body);margin:6px 0 10px;line-height:1.35}
#t-fc .catrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:2px solid var(--panel2);font-size:14px}
#t-pro .catrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:6px 0;border-top:2px solid var(--panel2);font-size:14px;margin:0}#t-pro .catrow .amt{white-space:nowrap;overflow:visible;text-overflow:clip}#t-pro .label+.catrow{margin-top:6px}
.prrep .catrow{display:flex;justify-content:space-between;gap:10px;margin:8px 0;font-size:14px}.prrep .catrow .amt{white-space:nowrap;overflow:visible;text-overflow:clip}.prtop{text-align:center;padding:6px 0 12px}.prtop .big{display:block}.prrank{margin:4px 0 0;color:var(--gold);font-size:18px}#t-pro .fch{margin:10px 0 2px}

/* 0.14 диалоги */
.ky{color:var(--gold)}.kg{color:var(--inc)}.kr{color:var(--exp,#e0675a)}.kb{color:#9db4ff}
.kw-tour b{font-weight:700}
.dlg-t i{font-style:normal;visibility:hidden}.dlg-t i.on{visibility:visible}
.tv-dim.intro{background:rgba(8,6,12,.82)}
.dlg{position:fixed;z-index:72;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;background:var(--panel);
  border:14px solid transparent;border-image:url(assets/panel-stone-r.webp) 48 stretch;background-clip:padding-box;padding:14px 4px 4px;cursor:pointer;animation:sheetin .3s cubic-bezier(.2,.9,.25,1) both}
.dlg-name{position:absolute;left:8px;top:-27px;background:var(--panel);border:2px solid var(--gold-d);padding:3px 10px;font:700 12px var(--body);color:var(--gold);letter-spacing:.05em}
.dlg-in{display:flex;gap:12px;align-items:flex-start;min-height:112px}
.dlg .tv-mage{flex:none;width:64px;background:var(--panel2);border:2px solid var(--line);padding:4px}
.dlg.intro .tv-mage{width:84px}
.dlg-t{font-size:16px;line-height:1.5;text-align:left;flex:1}
.dlg-bar{display:flex;align-items:center;gap:10px;margin-top:6px}
.dlg-dots{display:flex;gap:5px;margin-left:auto}
.dlg-dots u{width:7px;height:7px;background:var(--panel2);border:1px solid var(--line);text-decoration:none}.dlg-dots u.on{background:var(--gold);border-color:var(--gold-d)}
.dlg-more{color:var(--gold);opacity:0;font-size:14px}
.dlg.done .dlg-more{opacity:1;animation:dlgblink 1.1s ease-in-out infinite}
@keyframes dlgblink{50%{transform:translateY(3px);opacity:.5}}

/* 0.13.1 плавность */
.scrim{top:0;bottom:auto;height:100%}
.scrim.fresh{animation:scrimin .22s ease-out both}
.scrim.fresh .sheet{animation:sheetin .32s cubic-bezier(.2,.9,.25,1) both}
.scrim.mid.fresh .sheet{animation:midin .3s cubic-bezier(.2,.9,.25,1) both}
.scrim.closing{animation:scrimout .19s ease-in both;pointer-events:none}
.scrim.closing .sheet{animation:sheetout .19s ease-in both}
@keyframes scrimin{from{background:rgba(8,6,12,0)}}
@keyframes scrimout{to{background:rgba(8,6,12,0)}}
@keyframes sheetin{from{transform:translateY(36px);opacity:0}}
@keyframes sheetout{to{transform:translateY(36px);opacity:0}}
@keyframes midin{from{transform:translateY(14px) scale(.97);opacity:0}}
#app.swap{animation:viewin .26s ease-out both}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}}
.sheet{transition:max-height .28s cubic-bezier(.2,.8,.2,1);scroll-behavior:smooth;scroll-padding-bottom:80px}
.inp,select.inp,input.inp{height:46px;box-sizing:border-box}
textarea.inp{height:auto}
input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:1.2;padding-block:0;min-width:0}
input[type=date].inp::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
.two{align-items:start}
.field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px;min-height:18px}

/* 0.13: мягкие отклики, герой, приветствие */
.btn,.qk,.plus,.tab{transition:transform .16s cubic-bezier(.3,1.5,.5,1),filter .16s ease-out,box-shadow .16s ease-out}
.btn:active,.qk:active,.plus:active{transform:translateY(3px) scale(.985)}
@keyframes heroidle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hero-art svg{animation:heroidle 3.4s ease-in-out infinite!important}
.hero-art{position:relative}
.hero-art::after{content:'';position:absolute;left:22%;right:22%;bottom:4px;height:6px;background:rgba(0,0,0,.35);border-radius:50%;filter:blur(2px);animation:heroshadow 3.4s ease-in-out infinite;z-index:0}
.hero-art svg{position:relative;z-index:1}
@keyframes heroshadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.85);opacity:.22}}
.q .qxp{margin-left:auto;font-size:12px;color:var(--gold);white-space:nowrap;padding-left:8px}
.q.done .qxp{color:var(--mute)}
.updc{display:flex;align-items:center;justify-content:space-between;gap:10px}
.scrim.mid .sheet.fancy,.sheet.fancy{border:14px solid transparent;border-image:url(assets/panel-stone-r.webp) 48 stretch;background-clip:padding-box;box-shadow:none;max-height:94%;padding:0 6px 8px}
.sheet.fancy::before{content:"";display:block;height:18px;margin:-6px 4px -4px;background:url(assets/vine-edge.webp) repeat-x left top/auto 18px;pointer-events:none}
.obanner{position:relative;height:96px;margin:0 0 10px;border:2px solid var(--line);overflow:hidden;background:var(--panel2)}
.obanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.obt{position:absolute;left:0;bottom:0;padding:6px 12px;background:rgba(21,18,27,.88);border-top:2px solid var(--line);border-right:2px solid var(--line);font:400 15px var(--display);color:var(--gold)}
.otitle{font-size:17px;text-align:center;margin:4px 0 2px;color:var(--gold)}
.otext{text-align:center;color:var(--mute);font-size:14px}

/* 0.12.1: лозы */
.card::before{content:'';position:absolute;left:10px;right:10px;top:-13px;height:18px;background:url(assets/vine-edge.webp) repeat-x left top/auto 18px;pointer-events:none;z-index:2;opacity:.95}
.card{position:relative}
.btn.big::after,.btn.exp::after,.btn.inc::after{content:'';position:absolute;left:-12px;top:-12px;width:38px;height:38px;background:url(assets/vine-corner.webp) no-repeat center/contain;pointer-events:none;z-index:2}
.btn.inc::after{left:auto;right:-12px;transform:scaleX(-1)}

.btn{border-radius:0;letter-spacing:.02em;position:relative}
.btn:not(.ghost):not(.danger){background:linear-gradient(180deg,#f0cb68 0,var(--gold) 55%,#c8952c 100%)}
.btn.ghost{background:linear-gradient(180deg,#332c44 0,var(--panel2) 100%)}
.btn.big{min-height:64px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.exp{background:linear-gradient(180deg,#d4605a 0,#b8453e 100%)!important;border-color:#6e2420;color:#fff3ef;box-shadow:0 4px 0 #6e2420}
.btn.inc{background:linear-gradient(180deg,#6cb67a 0,#4f9a5c 100%)!important;border-color:#2b5d34;color:#effff1;box-shadow:0 4px 0 #2b5d34}
.bi{font:700 28px/1 var(--body)}
.logbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logc{border-color:var(--gold-d)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}

function nextUnlock(L){let best=null;Object.keys(GEAR).forEach(s=>GEAR[s].forEach(g=>{if(g.l>L&&(!best||g.l<best.l))best={l:g.l,n:g.n}}));PETS.forEach(p=>{if(p.l>L&&(!best||p.l<best.l))best={l:p.l,n:'компаньон '+p.n}});return best}

/* Счёт в валюте: остаток ведётся в его валюте (nat у записи — сумма в валюте счёта на момент записи), в тенге — по текущему курсу */
const accCur=a=>(a&&a.cur)||BASE;
function natOf(t,a,second){const c=accCur(a);if(c===BASE)return t.amount;const n=second?t.nat2:t.nat;if(n!=null)return n;
  if(t.ocur===c&&!second)return t.oamt;const v=convert(t.amount,BASE,c);return v==null?0:v}
function accBalNative(a){let b=Number(a.bal0)||0;
  for(const t of S.tx){if(t.type==='inc'&&t.acc===a.id)b+=natOf(t,a);else if(t.type==='exp'&&t.acc===a.id)b-=natOf(t,a);
    else if(t.type==='tr'){if(t.acc===a.id)b-=natOf(t,a);if(t.to===a.id)b+=natOf(t,a,true)}}return b}
function accBal(a){const n=accBalNative(a),c=accCur(a);if(c===BASE)return n;const v=convert(n,c,BASE);return v==null?0:v}
const totalBal=()=>S.accounts.reduce((s,a)=>s+accBal(a),0);
function dueDay(m,mk){const p=mk.split('-').map(Number);return Math.min(m.day,dim(p[0],p[1]))}
function mandStatus(m){const mk=mkey(today());const fut=!!(m.start&&m.start>mk);const pk=S.paid[m.id+'|'+mk];const paid=!fut&&(!!m.closed||!!pk);const dd=dueDay(m,mk);const day=+today().slice(8);
  return{paid:paid,dd:dd,overdue:!fut&&!paid&&day>dd,left:dd-day,future:fut,manual:pk==='manual'}}
const unpaidSum=()=>S.mand.reduce((s,m)=>{const x=mandStatus(m);return s+(x.paid||x.future?0:m.amount)},0);
const bankNow=()=>totalBal()-reserved();
/* «Уже оплачено»: отметка без списания со счёта, если платил до приложения или в другом месте */
function markPaid(id,on){const m=S.mand.find(x=>x.id===id);if(!m)return;const key=id+'|'+mkey(today());
  if(on){if(!S.paid[key])S.paid[key]='manual'}else if(S.paid[key]==='manual')delete S.paid[key]}

/* ---------- events, xp, streak ---------- */
let notes=[];
const say=t=>notes.push({k:'msg',t:t});
function gainXp(n,why){n=Math.round(n);if(n<=0)return;const b=levelInfo(S.xp).L;S.xp+=n;const a=levelInfo(S.xp).L;
  notes.push({k:'xp',n:n,why:why});
  if(a>b){let fz=0;for(let L=b+1;L<=a;L++){if(L%5===0&&S.streak.freezes<3){S.streak.freezes++;fz++}}notes.push({k:'lvl',from:b,to:a,fz:fz});petFood(3*(a-b))}}
function markActive(){const st=S.streak,t=today();if(st.last===t)return 0;
  if(!st.last){st.count=1}
  else{const d=dayDiff(st.last,t);
    if(d<=0)return 0;
    if(d===1)st.count++;
    else{const missed=d-1;
      if(st.freezes>=missed){st.freezes-=missed;st.count++;say('Заморозка спасла стрик: '+missed+' '+plural(missed,['пропущенный день','пропущенных дня','пропущенных дней']))}
      else st.count=1}}
  st.last=t;st.best=Math.max(st.best,st.count);
  if(st.count%7===0&&st.freezes<3){st.freezes++;say('Неделя подряд: получена заморозка стрика')}
  return 5+Math.min(st.count,20)}
/* Серия заходов: считаются дни, когда ты открыл приложение. Это очки для будущей гонки с друзьями */
function visitTick(){if(!S.visit||typeof S.visit!=='object')S.visit={count:0,last:null,best:0,total:0};const v=S.visit,t=today();if(v.last===t)return false;
  const d=v.last?dayDiff(v.last,t):0;
  if(!v.last||d>1)v.count=1;else if(d===1)v.count++;else return false;
  v.last=t;v.best=Math.max(v.best||0,v.count);v.total=(v.total||0)+1;
  gainXp(2+Math.min(v.count,10),'visit');
  if(v.count>1&&v.count%7===0)say('Заходов подряд: '+v.count+'. Так держать!');
  return true}
function visitView(){const v=S.visit||{count:0,last:null,best:0},d=v.last?dayDiff(v.last,today()):99;return{count:d<=1?v.count:0,best:v.best||0}}
function streakView(){const st=S.streak;if(!st.last)return{count:0,state:'new'};const d=dayDiff(st.last,today());
  if(d<=0)return{count:st.count,state:'ok'};if(d===1)return{count:st.count,state:'wait'};
  const missed=d-1;return st.freezes>=missed?{count:st.count,state:'frozen',missed:missed}:{count:0,state:'broken'}}
function addTx(o){const t=today();
  const tx={id:uid(),type:o.type,amount:o.amount,cat:o.cat||null,acc:o.acc,to:o.to||null,date:o.date||t,note:(o.note||'').trim(),mid:o.mid||null,ts:Date.now()};if(o.ocur){tx.ocur=o.ocur;tx.oamt=o.oamt}
  const nt=(acc)=>{const a=S.accounts.find(q=>q.id===acc),c=accCur(a);if(c===BASE)return null;if(o.ocur===c)return o.oamt;const v=convert(o.amount,BASE,c);return v==null?null:Math.round(v*100)/100};
  {const n1=nt(o.acc);if(n1!=null)tx.nat=n1;if(o.type==='tr'&&o.to){const n2=nt(o.to);if(n2!=null)tx.nat2=n2}}
  S.tx.push(tx);
  if(o.type==='tr')return tx;
  let xp=0;const n=S.dayRec[t]||0;if(n<5){S.dayRec[t]=n+1;xp=10}
  const b=markActive();
  if(o.type==='exp'&&tx.date===t&&S.noSpend[t]){delete S.noSpend[t];S.xp=Math.max(S.xp-10,xpAtLevel(levelInfo(S.xp).L));say('Отметка «трат не было» снята')}
  if(xp)gainXp(xp,'Запись');if(b)gainXp(b,'Бонус дня');questDone('tx');
  return tx}
function repeatList(kind){const lim=Date.now()-90*864e5,m={};
  S.tx.forEach(x=>{if(x.type!==kind||!x.cat||x.mid||x.ts<lim)return;const k=x.cat+'|'+(x.ocur?x.ocur+x.oamt:x.amount)+'|'+x.acc;
    const g=m[k]||(m[k]={cat:x.cat,amount:x.amount,ocur:x.ocur||null,oamt:x.oamt||null,acc:x.acc,note:'',n:0,ts:0});g.n++;if((x.ts||0)>=g.ts){g.ts=x.ts||0;g.note=x.note||''}});
  return Object.keys(m).map(k=>m[k]).sort((a,b)=>b.n-a.n||b.ts-a.ts).slice(0,4)}
function delTx(id){const i=S.tx.findIndex(x=>x.id===id);if(i<0)return;if(!S.del)S.del={};S.del[id]=Date.now();const dx=S.tx[i];if(dx.dp&&dx.mid){const dm=S.mand.find(m=>m.id===dx.mid);if(dm){dm.left=Math.round(((dm.left||0)+dx.dp)*100)/100;dm.closed=false}}S.tx.splice(i,1);
  Object.keys(S.paid).forEach(k=>{if(S.paid[k]===id)delete S.paid[k]})}
function noSpendToday(){const t=today();if(S.noSpend[t])return false;
  if(S.tx.some(x=>x.type==='exp'&&x.date===t)){say('Сегодня уже есть траты');return false}
  S.noSpend[t]=true;const b=markActive();gainXp(10,'Трат не было');petFood(1);if(b)gainXp(b,'Бонус дня');return true}
function payMand(id){const m=S.mand.find(x=>x.id===id);if(!m)return;const mk=mkey(today());const key=id+'|'+mk;if(S.paid[key]||mandStatus(m).future)return;
  const onTime=!mandStatus(m).overdue;
  let amt=m.amount,dp=0,closed=false;
  if(m.debt&&m.left>0){const intr=m.left*(m.rate||0)/1200;dp=Math.max(0,Math.min(m.left,m.amount-intr));if(m.left-dp<=0.5||m.amount>=m.left+intr){amt=Math.min(m.amount,Math.round(m.left+intr));dp=m.left;closed=true}}
  const tx=addTx({type:'exp',amount:amt,cat:m.cat,acc:m.acc,date:today(),note:m.name,mid:id});
  if(m.debt){tx.dp=dp;m.left=closed?0:Math.round((m.left-dp)*100)/100;if(closed){m.closed=true;gainXp(50,'Долг погашен')}}
  S.paid[key]=tx.id;if(onTime)gainXp(5,'Платёж вовремя')}

function questDone(k){if(!S.quest)S.quest={};if(S.quest[k])return;S.quest[k]=1;gainXp(15,'Путь новичка');
  if(!S.questAll&&QUEST.every(q=>S.quest[q[0]])){S.questAll=true;gainXp(30,'Путь новичка пройден')}}
function syncQuest(){if(S.questInit)return;S.quest=S.quest||{};
  if(S.tx.some(x=>x.type!=='tr'))S.quest.tx=1;if(S.mand.length)S.quest.mand=1;if(S.goals.length)S.quest.goal=1;
  if(S.goals.some(g=>g.contribs.length))S.quest.contrib=1;

/* ---------- goals and piggy banks ---------- */
function addGoal(o){const g={id:uid(),name:o.name,icon:o.icon||'🎯',target:o.target,deadline:o.deadline||null,contribs:[],reached:false,closed:false,created:today()};
  S.goals.push(g);questDone('goal');return g}
function addContrib(id,amt){const g=S.goals.find(x=>x.id===id&&!x.closed);if(!g||!amt)return 0;const t=today();
  if(amt<0){amt=Math.max(amt,-Math.max(0,goalSaved(g)));if(!amt)return 0;g.contribs.push({id:uid(),amt:amt,date:t,ts:Date.now()});return amt}
  g.contribs.push({id:uid(),amt:amt,date:t,ts:Date.now()});
  if(!S.dayGoal[t]){S.dayGoal[t]=1;const b=markActive();gainXp(10,'Взнос в цель');if(b)gainXp(b,'Бонус дня');petFood(2)}
  if(!g.reached&&goalSaved(g)>=g.target){g.reached=true;say('Цель достигнута: '+g.name);
    if(!S.dayGoal['r'+t]){S.dayGoal['r'+t]=1;gainXp(50,'Цель достигнута')}}
  questDone('contrib');return amt}
function delContrib(gid,cid){const g=S.goals.find(x=>x.id===gid&&!x.closed);if(!g)return false;
  const i=g.contribs.findIndex(c=>c.id===cid);if(i<0)return false;
  if(goalSaved(g)-g.contribs[i].amt<0)return false;g.contribs.splice(i,1);return true}
function closeGoal(id,o){const g=S.goals.find(x=>x.id===id&&!x.closed);if(!g)return null;
  const amount=o.amount!=null?o.amount:Math.max(0,goalSaved(g));let tx=null;
  if(amount>0){tx={id:uid(),type:'exp',amount:amount,cat:o.cat||'other',acc:o.acc,to:null,date:today(),note:g.name,mid:null,ts:Date.now()};S.tx.push(tx)}
  g.closed=true;g.closedOn=today();g.spent=amount;return tx}
function tomb(id){if(!S.del)S.del={};S.del[id]=Date.now()}
function delGoal(id){tomb(id);S.goals=S.goals.filter(g=>g.id!==id)}
function goalInfo(g){const saved=Math.max(0,goalSaved(g)),left=Math.max(0,g.target-saved);
  const pct=g.target>0?Math.min(100,Math.floor(saved/g.target*100)):0;const done=saved>=g.target;const t=today();
  let eta=null,onTrack=null,need=null,rate=0;
  const pos=g.contribs.filter(c=>c.amt>0).map(c=>c.date).sort();
  if(!done&&saved>0&&pos.length){const el=Math.max(7,dayDiff(pos[0],t));rate=saved/el;eta=addDays(t,Math.ceil(left/rate-1e-9))}
  if(g.deadline&&!done){const dl=dayDiff(t,g.deadline);if(dl>0){need=left/dl*30.4375;onTrack=eta?eta<=g.deadline:null}else onTrack=false}
  return{saved:saved,left:left,pct:pct,done:done,eta:eta,onTrack:onTrack,need:need,rate:rate}}

function lifeStats(){const tx=S.tx.filter(x=>x.type!=='tr');let inc=0,exp=0,incN=0;
  tx.forEach(x=>{if(x.type==='inc'){inc+=x.amount;if(!x.hist)incN++}else exp+=x.amount});
  let saved=0;S.goals.forEach(g=>{saved+=g.closed?(g.spent||0):Math.max(0,goalSaved(g))});
  return{recs:tx.filter(x=>!x.hist).length,inc:inc,exp:exp,incN:incN,best:S.streak.best,ns:Object.keys(S.noSpend).length,goals:S.goals.length,
    reached:S.goals.filter(g=>g.reached).length,bought:S.goals.filter(g=>g.closed).length,saved:saved,
    payN:Object.keys(S.paid).length,L:levelInfo(S.xp).L}}

function petDef(k){return PETS.find(p=>p.id===k)||PETS[0]}

/* Рисует питомца нужной стадии. box = [ширина, высота] области; все стадии одного питомца масштабируются одинаково, чтобы рост было видно. */
function petImg(k,st,mood,box){
  const sz=PETSZ[k];if(!sz)return '';const bw=box?box[0]:104,bh=box?box[1]:92;
  const mw=Math.max.apply(null,sz.map(x=>x[0])),mh=Math.max.apply(null,sz.map(x=>x[1]));
  const ratio=Math.max(sz[st][0]/mw,sz[st][1]/mh),sc=Math.min(bw/sz[st][0],bh/sz[st][1])*Math.pow(ratio,0.6);
  return '<img class="pet-img" src="assets/pet/'+k+'-'+(st+1)+'.webp" alt="'+esc(petStageName(st,k))+'" draggable="false" style="width:'+Math.round(sz[st][0]*sc)+'px;height:'+Math.round(sz[st][1]*sc)+'px">'}
function switchPet(k){const P=petDef(k),L=levelInfo(S.xp).L;if(!P||P.id!==k||P.l>L||k===petKind())return false;
  if(!S.petBox)S.petBox={};const cur=petKind(),food=(S.pet&&S.pet.food)||0;
  const old=Object.assign({},S.pet);delete old.food;S.petBox[cur]=old;
  const nx=S.petBox[k]||{xp:0,fedOn:null,name:P.nm};delete S.petBox[k];
  S.pet=Object.assign({},nx,{kind:k,food:food});return true}

function petInfo(){const p=S.pet||{food:0,xp:0,fedOn:null,name:'Желе'};let st=0;PET_XP.forEach((x,i)=>{if(p.xp>=x)st=i});

function monthsBack(n){const t=today();let y=+t.slice(0,4),m=+t.slice(5,7);const out=[];
  for(let i=0;i<n;i++){out.unshift(y+'-'+pad(m));m--;if(m===0){m=12;y--}}return out}
function buckets(period,mon){const t=today();let list=[];
  if(period==='week'){for(let i=6;i>=0;i--){const d=addDays(t,-i);list.push({key:d,from:d,to:d,label:WD[parseD(d).getDay()]})}}
  else if(period==='month'){const mk0=mon||mkey(t),y=+mk0.slice(0,4),m=+mk0.slice(5,7);
    for(let d=1;d<=dim(y,m);d++){const s=y+'-'+pad(m)+'-'+pad(d);list.push({key:s,from:s,to:s,label:String(d)})}}
  else{let keys;
    if(period==='half')keys=monthsBack(6);else if(period==='year')keys=monthsBack(12);
    else{let first=t;for(const x of S.tx)if(x.date<first)first=x.date;const fk=mkey(first);keys=monthsBack(36).filter(k=>k>=fk);if(!keys.length)keys=[mkey(t)]}

  list.forEach(b=>{b.exp=0;b.inc=0});
  const monthly=list[0].key.length===7;const map={};list.forEach(b=>{map[b.key]=b});
  const cats={};let rec=0;
  for(const x of S.tx){if(x.type==='tr')continue;const b=map[monthly?mkey(x.date):x.date];if(!b)continue;
    if(x.type==='exp'){b.exp+=x.amount;cats[x.cat]=(cats[x.cat]||0)+x.amount}else b.inc+=x.amount;rec++}
  const from=list[0].from,to=list[list.length-1].to;
  const ns=Object.keys(S.noSpend).filter(d=>d>=from&&d<=to).length;
  return{list:list,exp:list.reduce((s,b)=>s+b.exp,0),inc:list.reduce((s,b)=>s+b.inc,0),cats:cats,rec:rec,ns:ns,monthly:monthly}}
function monthRecords(){const m={};for(const x of S.tx){if(x.type==='tr')continue;const k=mkey(x.date);
  if(!m[k])m[k]={k:k,exp:0,inc:0};if(x.type==='exp')m[k].exp+=x.amount;else m[k].inc+=x.amount}return Object.keys(m).map(k=>m[k])}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v)));const n=v/e;

function guessCat(det){for(let i=0;i<MERCH.length;i++)if(MERCH[i][0].test(det))return MERCH[i][1];return null}
function merchKey(det){return String(det||'').toUpperCase().replace(/["«»“”'*]/g,'').replace(/(^|\s)(ИП|ТОО|ООО|АО)(?=\s)/g,' ').replace(/\s+/g,' ').trim().slice(0,32)}
const KTYPES=['Перевод на свой','Поступление со','Покупка','Перевод','Пополнение','Снятие','Разное'];
function parseKaspi(text){
  const t=String(text||'').replace(/ /g,' ').replace(/[−–—]/g,'-');
  const re=/(?:^|\s)(\d{2})\.(\d{2})\.(\d{2})\s+([+-])\s*(\d[\d ]*,\d{2})/g;

  while((m=re.exec(t)))hits.push({i:m.index,end:re.lastIndex,d:m[1],mo:m[2],y:m[3],sg:m[4],a:m[5]});
  const rows=[];
  hits.forEach((h,k)=>{
    let rest=t.slice(h.end,k+1<hits.length?hits[k+1].i:t.length);
    const cut=rest.search(/АО\s*«?Kaspi\s*Bank|Приложение к Справке|- Сумма заблокирована|Раздел «Краткое/);
    if(cut>=0)rest=rest.slice(0,cut);

    let ty=null,det0=null,mm;
    if((mm=rest.match(/^Перевод на (.+?) свой счет$/))){ty='Перевод на свой';det0=mm[1]}
    else if((mm=rest.match(/^Поступление (.+?) со своего счета$/))){ty='Поступление со';det0=mm[1]}
    if(!ty)for(let j=0;j<KTYPES.length;j++){const w=KTYPES[j];if(rest===w||rest.indexOf(w+' ')===0){ty=w;break}}
    if(!ty)return;
    let det=det0!==null?det0:rest.slice(ty.length).trim();
    if(ty==='Перевод на свой')det=det.replace(/^счет\s+/,'').replace(/\s+счет$/,'');
    if(ty==='Поступление со')det=det.replace(/^своего счета\s+/,'').replace(/\s+своего счета$/,'');
    det=det.replace(/\(\s*[+-]?\s*[\d ,.]+\s*(USD|EUR|RUB|KZT)\s*\)/g,'').replace(/\s+/g,' ').trim();
    const amt=parseFloat(h.a.replace(/ /g,'').replace(',','.'))*(h.sg==='-'?-1:1);
    if(!isFinite(amt)||amt===0)return;
    rows.push({date:'20'+h.y+'-'+h.mo+'-'+h.d,amt:amt,type:ty,det:det})});

function classifyRow(r,o){const a=r.amt,det=r.det,key=merchKey(det);
  const skip=why=>({kind:'skip',why:why});
  if(r.type==='Перевод на свой'){if(/кредит/i.test(det)&&a<0)return{kind:'exp',cat:'credit',note:det,key:key};return skip('internal')}

  if(r.type==='Снятие')return skip('cash');
  if(r.type==='Пополнение'){if(/банкомат/i.test(det))return skip('cash');if(a<0)return skip('other');return o&&o.inc===false?skip('people'):{kind:'inc',cat:'otherin',note:det,key:key}}

  if(r.type==='Разное')return a<0?{kind:'exp',cat:'other',note:det,key:key}:{kind:'inc',cat:/зарплат|заработн|salary|payroll|аванс/i.test(det)?'salary':'otherin',note:det,key:key};
  if(a>0)return{kind:'inc',cat:'otherin',note:'Возврат: '+det,key:key};
  const known=(S.rules&&S.rules[key])||guessCat(det);
  return{kind:'exp',cat:known||null,note:det,key:key}}
function planImport(rows,o){o=o||{};
  const have={};S.tx.forEach(x=>{if(x.imp)have[x.imp]=1});const seen={};
  const items=[],skip={},unk={},nocur={};let dups=0;
  rows.forEach(r=>{const c=classifyRow(r,o);
    if(c.kind==='skip'){skip[c.why]=(skip[c.why]||0)+1;return}
    const cur=r.cur&&r.cur!==BASE?r.cur:null;
    const base=r.date+'|'+r.amt+(cur?cur:'')+'|'+r.type+'|'+merchKey(r.det);seen[base]=(seen[base]||0)+1;const dk=base+'#'+seen[base];
    if(have[dk]){dups++;return}

    if(cur){const rt=rateOf(cur);if(!rt){nocur[cur]=(nocur[cur]||0)+1;return}ocur=cur;oamt=amount;amount=Math.round(amount*rt)}
    const it={date:r.date,amount:amount,type:c.kind,cat:c.cat,note:c.note,key:c.key,imp:dk,ocur:ocur,oamt:oamt};
    if(it.type==='exp'&&!it.cat){const m=o.map&&o.map[c.key];if(m)it.cat=m;else{it.unk=true;const u=unk[c.key]||(unk[c.key]={key:c.key,name:c.note,n:0,sum:0});u.n++;u.sum+=it.amount}}
    items.push(it)});
  return{items:items,skip:skip,dups:dups,nocur:nocur,unknown:Object.keys(unk).map(k=>unk[k]).sort((a,b)=>b.sum-a.sum)}}
function histReward(){const h=S.tx.filter(x=>x.hist);if(h.length<15)return 0;let first=h[0].date;h.forEach(x=>{if(x.date<first)first=x.date});
  const m=Math.min(3,Math.floor(dayDiff(first,today())/30)),done=S.histM||0;if(m<=done)return 0;S.histM=m;return(m-done)*30}
function applyImport(o){const P=planImport(o.rows,o);if(!S.rules)S.rules={};

    S.tx.push({id:uid(),type:it.type,amount:it.amount,cat:it.cat,acc:o.acc,to:null,date:it.date,note:it.note,mid:null,ocur:it.ocur||null,oamt:it.oamt||null,ts:parseD(it.date).getTime()+43200000+i,hist:true,imp:it.imp});

  const a=S.accounts.find(x=>x.id===o.acc);if(a)a.bal0=(Number(a.bal0)||0)+exp-inc;
  const w=histReward();if(w)gainXp(w,'История трат');
  return{n:P.items.length,exp:exp,inc:inc}}
function pdfItemsToText(pages){return pages.map(items=>{
  const a=items.filter(i=>i.str&&String(i.str).trim()).map(i=>({s:String(i.str).trim(),x:i.x,y:i.y}));
  a.sort((p,q)=>q.y-p.y);const lines=[];

function parseAmt(s){
  if(typeof s==='number')return isFinite(s)?s:null;
  let t=String(s==null?'':s).replace(/[     ]/g,'').replace(/[−–—]/g,'-').trim();
  if(!t)return null;let neg=false;

  if(/DR$/i.test(t)){neg=!neg;t=t.slice(0,-2)}else if(/CR$/i.test(t))t=t.slice(0,-2);
  t=t.replace(/^[A-Za-zА-Яа-яЁё₸₽$€£¥]+\.?/,'').replace(/[A-Za-zА-Яа-яЁё₸₽$€£¥]+\.?$/,'');
  if(/^\+/.test(t))t=t.slice(1);
  if(/^-/.test(t)){neg=!neg;t=t.slice(1)}
  if(/-$/.test(t)){neg=!neg;t=t.slice(0,-1)}

  if(!/^[\d.,']+$/.test(t)||!/\d/.test(t))return null;
  t=t.replace(/'/g,'');
  const lc=t.lastIndexOf(','),ld=t.lastIndexOf('.');
  if(lc>=0&&ld>=0){t=lc>ld?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'')}
  else if(lc>=0){const p=t.split(',');t=(p.length===2&&p[1].length!==3)?p.join('.'):t.replace(/,/g,'')}
  else if(ld>=0){const p=t.split('.');if(p.length>2)t=t.replace(/\./g,'')}
  const v=parseFloat(t);return isFinite(v)?(neg?-v:v):null}

function parseDateAny(s,us){

  if(E.all&&key&&x.type==='exp'){if(!S.rules)S.rules={};S.rules[key]=E.cat}
  return{ok:true,changed:sim.length+1}}

function monthKeys(){const t=today();let first=mkey(t);for(const x of S.tx){const k=mkey(x.date);if(k<first)first=k}
  const out=[];let y=+first.slice(0,4),m=+first.slice(5,7);const ty=+t.slice(0,4),tm=+t.slice(5,7);
  while(y<ty||(y===ty&&m<=tm)){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++}}return out}
function dayStats(mk){const m={};for(const x of S.tx){if(x.type==='tr'||mkey(x.date)!==mk)continue;
  const d=m[x.date]||(m[x.date]={date:x.date,exp:0,inc:0,n:0});if(x.type==='exp')d.exp+=x.amount;else d.inc+=x.amount;d.n++}
  return Object.keys(m).map(k=>m[k]).sort((a,b)=>a.date<b.date?1:-1)}
function quickAdd(i){const r=repeatList('exp')[i];if(!r)return null;const acc=S.accounts.find(a=>a.id===r.acc)?r.acc:S.accounts[0].id;
  const kz=r.ocur&&rateOf(r.ocur)?Math.round(convert(r.oamt,r.ocur,BASE)*100)/100:r.amount;
  const tx=addTx({type:'exp',amount:kz,cat:r.cat,acc:acc,note:r.note,ocur:r.ocur,oamt:r.oamt});S.lastAcc=acc;return tx}

/* ---------- прогноз: хватит ли до зарплаты ---------- */
function payHorizon(t){const d=parseD(t),y=d.getFullYear(),m=d.getMonth(),pd=S.payday;
  if(!pd){const last=dstr(new Date(y,m+1,0));return{date:last,days:dayDiff(t,last)+1,pay:false}}
  const cl=(yy,mm)=>Math.min(pd,new Date(yy,mm+1,0).getDate());let c=dstr(new Date(y,m,cl(y,m)));
  if(c<=t)c=dstr(new Date(y,m+1,cl(y,m+1)));
  return{date:c,days:dayDiff(t,c),pay:true}}
function avgDaily(t){const from=addDays(t,-30);
  const ex=S.tx.filter(x=>x.type==='exp'&&!x.mid&&x.cat!=='credit'&&x.cat!=='xfer'&&x.date>=from&&x.date<t);
  if(ex.length<3)return null;let first=t;ex.forEach(x=>{if(x.date<first)first=x.date});
  const span=Math.min(30,dayDiff(first,t));if(span<3)return null;
  return ex.reduce((q,x)=>q+x.amount,0)/span}
/* Обязательные платежи будущих месяцев (текущий месяц уже в unpaidSum) */
function mandEvents(from,end){const out=[],cur=mkey(today());
  S.mand.forEach(m=>{if(m.closed)return;let left=m.debt?(m.left||0):Infinity;
    let d=parseD(cur+'-01');d.setMonth(d.getMonth()+1);
    for(let i=0;i<36&&left>0;i++){const mk=dstr(d).slice(0,7);const ds=mk+'-'+String(dueDay(m,mk)).padStart(2,'0');
      if(ds>end)break;if(!(m.start&&m.start>mk)){const a=Math.min(m.amount,m.debt?Math.ceil(left):m.amount);if(ds>=from)out.push({date:ds,amount:a,type:'exp',cat:m.cat,mand:m.id});left-=a}
      d.setMonth(d.getMonth()+1)}});
  return out}
function forecast(){const t=today(),h=payHorizon(t),bank=freeMoney()-mandEvents(t,h.date).reduce((q,e)=>q+e.amount,0),avg=avgDaily(t);
  const per=h.days>0?bank/h.days:0;const r={days:h.days,until:h.date,pay:h.pay,bank:bank,perDay:Math.max(0,Math.floor(per)),avg:avg};
  if(bank<=0){r.state='broke';return r}
  if(avg==null){r.state='few';return r}
  const need=avg*h.days;r.need=need;r.diff=bank-need;
  if(avg<=0){r.state='ok';r.runOut=null;return r}
  r.runOut=addDays(t,Math.floor(bank/avg));r.state=r.diff>=0?'ok':'short';return r}

/* ---------- пророчества: ожидаемые доходы и расходы, сверка с жизнью ---------- */
const proList=()=>S.pro||(S.pro=[]);
const proWait=()=>proList().filter(p=>p.st==='wait').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const proEvents=(t,end)=>proWait().filter(p=>p.date>=t&&p.date<=end).concat(mandEvents(t,end)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
/* Остаток к дате = свободные деньги + ожидаемые доходы - ожидаемые расходы (только то, что записано пророчествами) */
function proBalanceAt(end){let b=freeMoney();proEvents(today(),end).forEach(p=>{b+=p.type==='inc'?p.amount:-p.amount});return b}
/* Кассовый разрыв: первая дата, когда остаток уходит в минус, и насколько глубоко он падает после этого */
function proGap(days){const t=today(),end=addDays(t,days||60);let b=freeMoney(),first=b<0?t:null,low=b;
  proEvents(t,end).forEach(p=>{b+=p.type==='inc'?p.amount:-p.amount;if(b<0&&!first)first=p.date;if(first&&b<low)low=b});
  return first?{date:first,deficit:Math.ceil(-low)}:null}
function proResolve(id,kind,fact){const p=proList().find(x=>x.id===id);if(!p||p.st!=='wait')return false;
  if(kind==='miss'){p.st='miss';p.fact=0;p.hit=false}
  else{const amt=Math.round((kind==='hit'?p.amount:fact)*100)/100;if(!(amt>0)||amt>MAXAMT)return false;
    const acc=S.accounts.find(a=>a.id===p.acc)?p.acc:(S.accounts[0]||{}).id;if(!acc)return false;
    const tx=addTx({type:p.type,amount:amt,cat:p.cat,acc:acc,date:p.date<=today()?p.date:today(),note:p.note});
    p.st='done';p.fact=amt;p.tx=tx.id;p.hit=Math.abs(amt-p.amount)/p.amount<=PRO_TOL;
    if(p.hit&&p.c&&p.c<p.date&&p.date<=today())gainXp(15,'Пророчество сбылось')}
  p.done=today();p.u=Date.now();
  if(p.rec==='month')proList().push({id:uid(),type:p.type,cat:p.cat,acc:p.acc,amount:p.amount,date:addMonths(p.date,1),note:p.note,rec:'month',st:'wait',fact:null,c:today(),u:Date.now()});
  return true}
/* Меткость и привычные ошибки: считаются по закрытым пророчествам */
const PRO_TOL=0.1,PRO_MIN=3;
const proMedian=a=>{const b=a.slice().sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):0};
function proStats(){const all=proList().filter(p=>p.st==='done'||p.st==='miss'),from=addDays(today(),-30);
  const o={n:all.length,hits:0,cats:{},leak:0};
  all.forEach(p=>{if(p.st==='done'&&Math.abs(p.fact-p.amount)/p.amount<=PRO_TOL)o.hits++;
    if(p.st!=='done')return;const c=o.cats[p.cat]||(o.cats[p.cat]={n:0,errs:[],type:p.type,leak:0});c.n++;c.errs.push((p.fact-p.amount)/p.amount);
    const d=p.fact-p.amount,bad=(p.type==='exp'&&d>0)||(p.type==='inc'&&d<0);if(bad&&p.done>=from){c.leak+=Math.abs(d);o.leak+=Math.abs(d)}});
  o.acc=o.n?Math.round(o.hits/o.n*100):null;
  Object.keys(o.cats).forEach(k=>{const c=o.cats[k];c.bias=proMedian(c.errs);c.mae=c.errs.reduce((q,x)=>q+Math.abs(x),0)/c.n;c.ok=c.n>=PRO_MIN});
  return o}
function proRank(st){if(st.n<5)return 'Новичок';if(st.n>=20&&st.acc>=85)return 'Оракул';if(st.n>=10&&st.acc>=70)return 'Провидец';return 'Подмастерье'}
/* Три сценария остатка к дате: ожидаемый (с поправкой на твою привычную ошибку), худший и лучший (с разбросом = средняя ошибка по категории, без данных 10%) */
function proScen(end){const st=proStats();let e=freeMoney(),w=e,b=e;
  proEvents(today(),end).forEach(p=>{const c=st.cats[p.cat],ok=c&&c.ok,bias=ok?Math.max(-.5,Math.min(1,c.bias)):0,sp=ok?Math.min(.5,c.mae):.1,a=p.amount*(1+bias),inc=p.type==='inc',sg=inc?1:-1;
    e+=sg*a;w+=sg*a*(inc?1-sp:1+sp);b+=sg*a*(inc?1+sp:1-sp)});
  return{exp:e,worst:w,best:b}}
const pct=x=>(x>=0?'+':'−')+Math.round(Math.abs(x)*100)+'%';
function sheetProRep(){const st=proStats(),rk=proRank(st);
  let h=shHead('Меткость пророка')+'<div class="prrep">';
  if(!st.n)return h+'<p>Пока нет закрытых пророчеств. Когда срок наступит и ты отметишь «Сбылось» или «Не сбылось», здесь появится твоя меткость.</p></div>';
  h+='<div class="prtop"><div class="big">'+st.acc+'%</div><p class="sub">'+st.hits+' из '+st.n+' попали в ±'+Math.round(PRO_TOL*100)+'%</p><p class="prrank">'+rk+'</p></div>';
  const ks=Object.keys(st.cats).sort((a,b)=>st.cats[b].n-st.cats[a].n);
  if(ks.length){h+='<div class="label">По категориям</div>';
    ks.forEach(k=>{const c=st.cats[k],ci=catInfo(k);h+='<div class="catrow"><span>'+ci.icon+' '+esc(ci.name)+' · '+c.n+' шт.</span><span class="amt '+(c.ok?((c.type==='exp'?c.bias>0.05:c.bias<-0.05)?'neg':''):'')+'">'+(c.ok?pct(c.bias):'мало данных')+'</span></div>'})}
  if(st.leak>0)h+='<p class="fch neg">За 30 дней ушло мимо плана: '+fmtDt(Math.round(st.leak))+'</p><p class="sub">Это траты сверх плана плюс недополученные доходы.</p>';
  const worst=ks.filter(k=>st.cats[k].ok&&st.cats[k].type==='exp'&&st.cats[k].bias>0.05).sort((a,b)=>st.cats[b].bias-st.cats[a].bias)[0];
  if(worst)h+='<p>Сильнее всего ты недооцениваешь «'+esc(catInfo(worst).name)+'»: обычно выходит '+pct(st.cats[worst].bias)+'. Закладывай запас.</p>';
  else h+='<p class="note">Ошибка по категории появится после '+PRO_MIN+' закрытых пророчеств.</p>';
  return h+'<p class="note">Оценка по закрытым пророчествам. Чем их больше, тем точнее.</p></div>'}
function proRow(p,due){const c=catInfo(p.cat),inc=p.type==='inc';
  const when=due?(p.date===today()?'сегодня':'ждали '+fmtDate(p.date)):fmtDate(p.date);
  return '<div class="prow"><div class="row" data-act="proedit" data-v="'+p.id+'" role="button" tabindex="0"><span class="tile">'+c.icon+'</span><span class="mid"><div class="t1">'+esc(p.note||c.name)+'</div><div class="t2">'+when+(p.rec==='month'?' · каждый месяц':'')+'</div></span>'
   +'<span class="amt '+(inc?'pos':'neg')+'">'+(inc?'+':'−')+fmt(p.amount)+'</span></div>'
   +(due?'<div class="pbtns"><button class="btn small" data-act="prohit" data-v="'+p.id+'">Сбылось</button><button class="btn small ghost" data-act="prodiff" data-v="'+p.id+'">Иначе</button><button class="btn small ghost" data-act="promiss" data-v="'+p.id+'">Не сбылось</button></div>':'')+'</div>'}
function proCard(){if(!S.accounts.length)return '';const t=today(),w=proWait(),due=w.filter(p=>p.date<=t),soon=w.filter(p=>p.date>t);
  const end=payHorizon(t).date,ev=proEvents(t,end),si=ev.filter(p=>p.type==='inc').reduce((q,p)=>q+p.amount,0),se=ev.filter(p=>p.type==='exp').reduce((q,p)=>q+p.amount,0);
  const pst=proStats();
  let h='<section class="card" id="t-pro"><div class="label">Пророчества'+hq('pro')+'</div>'+(pst.n?'<p class="sub" style="margin:0 0 6px">Меткость '+pst.acc+'% · '+proRank(pst)+'</p>':'');
  if(!w.length)h+='<p>Запиши, что ждёшь: зарплату, платёж, покупку.</p>';
  else{const g=proGap(60);
    if(ev.length){const sc=proScen(end),bal=proBalanceAt(end);
      h+='<div class="catrow"><span>Ждёшь до '+fmtDate(end)+'</span><span class="amt"><span class="pos">+'+fmtDt(si)+'</span> <span class="neg">−'+fmtDt(se)+'</span></span></div>'
      +'<div class="catrow"><span>Останется по плану</span><span class="amt '+(bal<0?'neg':'')+'">'+fmtDt(bal)+'</span></div>'
      +(Math.abs(sc.exp-bal)>1?'<div class="catrow"><span>С поправкой на твои привычки</span><span class="amt '+(sc.exp<0?'neg':'')+'">'+fmtDt(sc.exp)+'</span></div>':'')
      +'<div class="catrow"><span>Худший случай</span><span class="amt '+(sc.worst<0?'neg':'')+'">'+fmtDt(sc.worst)+'</span></div>'
      +'<div class="catrow"><span>Лучший случай</span><span class="amt '+(sc.best<0?'neg':'')+'">'+fmtDt(sc.best)+'</span></div>'}
    if(g)h+='<p class="fch neg">Кассовый разрыв с '+fmtDate(g.date)+': не хватит около '+fmtDt(g.deficit)+'</p><p class="sub">Считаю только то, что записано пророчествами, без обычных трат.</p>';
    h+='<div class="list">'+due.map(p=>proRow(p,true)).join('')+soon.slice(0,Math.max(0,3-due.length)).map(p=>proRow(p,false)).join('')+'</div>';
    if(w.length>Math.max(3,due.length))h+='<p class="sub">И ещё '+(w.length-Math.max(3,due.length))+' впереди.</p>'}
  return h+'<div class="pbtns" style="padding:10px 0 0"><button class="btn ghost" style="flex:1" data-act="pronew">+ Пророчество</button>'+(pst.n?'<button class="btn ghost" style="flex:1" data-act="prorep">Меткость</button>':'')+'</div></section>'}
function openPro(id){const p=proList().find(x=>x.id===id);
  UI.form=p?{type:p.type,amount:String(p.amount),cat:p.cat,acc:p.acc,date:p.date,note:p.note||'',rec:p.rec==='month',err:''}
   :{type:'exp',amount:'',cat:catsFor('exp')[0].id,acc:S.accounts.find(a=>a.id===S.lastAcc)?S.lastAcc:S.accounts[0].id,date:addDays(today(),1),note:'',rec:false,err:''};
  openSheet('pro',{id:id||null})}
function proHint(f){const c=proStats().cats[f.cat];if(!c||!c.ok||Math.abs(c.bias)<0.03)return '';
  return '<p class="note">По этой категории ты обычно ошибаешься на '+pct(c.bias)+'. <button class="fc" data-act="proapply">Учесть поправку</button></p>'}
function sheetPro(){const f=UI.form,edit=!!UI.sheet.id;

   +'<div class="two"><div class="field"><label for="pa">Сумма, '+bSym()+'</label><input id="pa" class="inp" data-f="amount" inputmode="decimal" value="'+esc(f.amount)+'"></div>'
   +'<div class="field"><label for="pd">Когда</label><input id="pd" class="inp" type="date" data-f="date"'+(edit?'':' min="'+today()+'"')+' value="'+esc(f.date)+'"></div></div>'
   +'<div class="two"><div class="field"><label for="pc">Категория</label><select id="pc" class="inp" data-f="cat">'+catsFor(f.type).map(c=>'<option value="'+c.id+'"'+(f.cat===c.id?' selected':'')+'>'+(c.emo||c.icon)+' '+esc(c.name)+'</option>').join('')+'</select></div>'

/* ---------- долги и рассрочки ---------- */
function addMonths(t,n){const d=parseD(t),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return dstr(d)}
const isDebt=m=>!!m.debt&&!m.closed;
const debtsAll=()=>S.mand.filter(m=>m.debt);
const debtsOpen=()=>S.mand.filter(isDebt);
function debtMonths(left,pay,rate){if(!(left>0))return 0;if(!(pay>0))return Infinity;const r=(rate||0)/1200;
  if(r===0)return Math.ceil(left/pay-1e-9);if(pay<=r*left)return Infinity;return Math.ceil(-Math.log(1-r*left/pay)/Math.log(1+r)-1e-9)}
function debtInfo(m,extra){const pay=m.amount+(extra||0);const n=debtMonths(m.left,pay,m.rate);
  return{months:n,end:isFinite(n)?addMonths(today(),Math.max(0,n-(mandStatus(m).paid?0:1))+(mandStatus(m).paid?0:0)):null,interest:isFinite(n)?Math.max(0,Math.round(pay*n-m.left)):null}}
const debtMonthly=()=>debtsOpen().reduce((q,m)=>q+m.amount,0);
const debtLeft=()=>debtsOpen().reduce((q,m)=>q+m.left,0);
function monthlyIncome(){const t=today(),from=addDays(t,-90);const v=S.tx.filter(x=>x.type==='inc'&&x.date>=from&&x.date<=t).reduce((q,x)=>q+x.amount,0);return v>0?v/3:null}
function monthlySpend(){const t=today(),from=addDays(t,-90);const v=S.tx.filter(x=>x.type==='exp'&&x.cat!=='credit'&&x.cat!=='xfer'&&x.date>=from&&x.date<=t).reduce((q,x)=>q+x.amount,0);return v>0?v/3:null}
function debtAdvice(){const out=[],d=debtsOpen();if(!d.length)return out;
  const inc=monthlyIncome(),mon=debtMonthly();
  if(inc){const p=mon/inc,pc=Math.round(p*100);
    if(p>=0.5)out.push('Платежи по долгам съедают '+pc+'% твоего дохода. Это опасная нагрузка: главная цель сейчас не брать новые долги и искать, что можно сократить.');
    else if(p>=0.35)out.push('Платежи по долгам: '+pc+'% дохода. Это много. Новые рассрочки лучше пока не брать.');
    else if(p>=0.2)out.push('Платежи по долгам: '+pc+'% дохода. Нормально, но следи, чтобы доля не росла.');
    else out.push('Платежи по долгам: '+pc+'% дохода. Нагрузка спокойная.')}
  else out.push('Добавь свои доходы в приложение, и я оценю, какую долю дохода съедают долги.');
  const bad=d.filter(m=>!isFinite(debtMonths(m.left,m.amount,m.rate)));
  bad.forEach(m=>out.push('Платёж по «'+m.name+'» не покрывает проценты, долг растёт. Нужно платить больше, иначе он не закроется.'));
  const paying=d.filter(m=>(m.rate||0)>0&&isFinite(debtMonths(m.left,m.amount,m.rate)));

    const c=new C();SND.ctx=c;SND.master=c.createGain();SND.master.gain.value=(S.sound&&S.sound.vol!=null)?S.sound.vol:0.6;SND.master.connect(c.destination);
    SND.sg=c.createGain();SND.sg.connect(SND.master);SND.mg=c.createGain();SND.mg.gain.value=0;SND.mg.connect(SND.master)}
  if(SND.ctx.state==='suspended')rz(SND.ctx.resume());return SND.ctx}
function playSfx(n){try{if(S.calm||!S.sound||!S.sound.sfx)return;const c=sndCtx();if(!c||!SFX[n])return;SFX[n](c,SND.sg,c.currentTime+0.001)}catch(e){}}
function musicSync(){try{const want=S.sound&&S.sound.music&&!S.calm;
  if(want){const c=sndCtx();if(!c)return;SND.mg.gain.cancelScheduledValues(c.currentTime);SND.mg.gain.setTargetAtTime(0.5,c.currentTime,0.3);
    if(!SND.timer){SND.nextT=c.currentTime+0.1;SND.step=0;
      SND.timer=setInterval(()=>{const k=SND.ctx;if(!k)return;while(SND.nextT<k.currentTime+0.4){musicStep(k,SND.mg,SND.nextT,SND.step++);SND.nextT+=EIGHTH}},100)}}
  else if(SND.timer&&SND.ctx){SND.mg.gain.setTargetAtTime(0,SND.ctx.currentTime,0.2);const tm=SND.timer;SND.timer=null;setTimeout(()=>clearInterval(tm),900)}}catch(e){}}
function bankCurs(){return [BASE].concat(['USD','EUR','RUB','KZT','CNY','GBP','TRY','UZS','KGS'].filter(c=>c!==BASE&&rateOf(c)))}
function bankBig(bn){const list=bankCurs();let c=UI.bankCur&&list.indexOf(UI.bankCur)>0?UI.bankCur:BASE;
  if(list.length<2)return '<div class="big '+(bn<0?'neg':'')+'" title="'+fmt(bn)+'">'+fmtD(bn)+'</div>';
  const nx=list[(list.indexOf(c)+1)%list.length];
  if(c===BASE)return '<button class="big bigbtn '+(bn<0?'neg':'')+'" data-act="bankcur" title="'+fmt(bn)+'" aria-label="Показать в '+nx+'">'+fmtD(bn)+'<span class="curchip">'+curInfo(nx).flag+' '+nx+'</span></button>';
  return '<button class="big bigbtn alt '+(bn<0?'neg':'')+'" data-act="bankcur" aria-label="Показать в '+nx+'">≈ '+fmtCur(convert(bn,BASE,c),c)+'<span class="curchip">'+curInfo(nx).flag+' '+nx+'</span></button>'

function canRebase(){return !S.tx.length&&!(S.goals||[]).length&&!(S.mand||[]).length}
function setBase(c){if(!CUR.find(k=>k[0]===c)||c===BASE)return;const old=BASE;
  S.accounts.forEach(a=>{if(!a.cur&&(Number(a.bal0)||0)!==0)a.cur=old;else if(a.cur===c)delete a.cur});
  S.base=c;S.rates=null;UI.bankCur=null;S.lastCur=null;save();fetchRates(true).then(()=>{render();if(UI.sheet)renderSheet()});render();if(UI.sheet)renderSheet()}

let TRC=null;
const MONEYRX=/(?:[$€£¥₴₾֏₼] ?)?\d+(?:[   ,.]\d+)*(?:[  ](?:₸|₽|₴|₾|֏|₼|Br|zł|SM|AED|сум|с)(?![A-Za-zА-Яа-яЁё]))?/g;
function trCompile(){const exact={},tpl={},frag={};const fl=[];
  for(const k0 in I18N_EN){const v0=I18N_EN[k0];const k=k0.replace(/\{(\d+)\}[  ]₸/g,'{$1}'),v=v0.replace(/\{(\d+(?:\|[^}]*)?)\}[  ]₸/g,'{$1}');
    if(/\{\d/.test(k))tpl[k]=v;else{exact[k]=v;if(k.length>=2&&/[А-Яа-яЁё]/.test(k)){frag[k]=v;fl.push(k)}}}
  fl.sort((a,b)=>b.length-a.length);const L='A-Za-zА-Яа-яЁё';
  let rx=null;try{rx=new RegExp('(^|[^'+L+'])('+fl.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?=[^'+L+']|$)','g')}catch(e){}
  TRC={exact,tpl,frag,rx,cache:new Map()}}
function plEN(n,a,b){const v=parseFloat(String(n).replace(/[^\d.]/g,''));return v===1?a:b}
function trCore(x){const C=TRC;let r=C.exact[x];if(r!=null)return r;
  const nums=[];const k=x.replace(MONEYRX,m=>{nums.push(m);return '{'+(nums.length-1)+'}'});
  r=nums.length?C.tpl[k]:null;
  if(r!=null)return r.replace(/\{(\d+)(?:\|([^|}]*)\|([^}]*))?\}/g,(m,i,a,b)=>{const n=nums[+i];if(n==null)return m;return a!=null?n+' '+plEN(n,a,b):n});
  return null}
function trText(raw){if(!raw||!TRC||!/[А-Яа-яЁё]/.test(raw))return raw;const C=TRC;let r=C.cache.get(raw);if(r!==undefined)return r;
  const lead=raw.match(/^\s*/)[0],trail=raw.match(/\s*$/)[0];let x=raw.trim().replace(/[ \t\n]+/g,' ');
  const sym=bSym(),sw=sym!=='₸'&&sym.length<=3;if(sw)x=x.split(sym).join('₸');
  let res=trCore(x);
  if(res==null&&x.indexOf(' · ')>0){const parts=x.split(' · ').map(q=>{const t=trCore(q);return t==null?q:t});if(parts.some((q,i)=>q!==x.split(' · ')[i]))res=parts.join(' · ')}
  if(res==null&&x.indexOf(': ')>0){const i=x.indexOf(': ');const a=trCore(x.slice(0,i+1)),b=trCore(x.slice(i+2));if(a!=null)res=a+' '+(b!=null?b:x.slice(i+2))}
  if(res==null&&C.rx)res=x.replace(C.rx,(m,p,f)=>p+(C.frag[f]!=null?C.frag[f]:f));
  if(res==null)res=x;if(sw)res=res.split('₸').join(sym);
  r=lead+res+trail;if(C.cache.size>4000)C.cache.clear();C.cache.set(raw,r);return r}
function trRaw(s){try{if(S&&S.lang==='en'){if(!TRC)trCompile();const v=I18N_EN[s];return v!=null?v:s}}catch(e){}return s}
function isEn(){try{return !!(S&&S.lang==='en')}catch(e){return false}}
function trNode(root){if(!isEn()||!root)return;if(!TRC)trCompile();
  const doText=t=>{const p=t.parentNode;if(!p)return;const tg=p.nodeName;if(tg==='SCRIPT'||tg==='STYLE')return;if(tg==='TEXTAREA'&&p.id!=='aix')return;
    if(p.closest&&p.closest('.notr,.dlg-t'))return;const v=t.data;if(!/[А-Яа-яЁё]/.test(v))return;const r=trText(v);if(r!==v)t.data=r};
  if(root.nodeType===3){doText(root);return}
  if(root.nodeType!==1)return;
  try{const w=document.createTreeWalker(root,4);const list=[];let n;while((n=w.nextNode()))list.push(n);list.forEach(doText)}catch(e){}
  const at=e=>{for(const a of ['placeholder','aria-label','title']){const v=e.getAttribute&&e.getAttribute(a);if(v&&/[А-Яа-яЁё]/.test(v)){const r=trText(v);if(r!==v)e.setAttribute(a,r)}}};
  try{at(root);root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(at)}catch(e){}}
function bootI18n(){try{if(typeof MutationObserver==='undefined')return;
  const mo=new MutationObserver(ms=>{if(!isEn())return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}});
  mo.observe(document.body,{childList:true,subtree:true,characterData:true})}catch(e){}}
function setLang(v){const l=v==='en'?'en':'ru';if((S.lang||'ru')===l)return;S.lang=l;save();
  try{document.documentElement.lang=l}catch(e){}
  if(l==='en'){if(!TRC)trCompile();render();if(UI.sheet)renderSheet();trNode(document.body)}
  else{try{location.reload()}catch(e){render();if(UI.sheet)renderSheet()}}}

function flush(){const n=notes;notes=[];let xp=0,food=0;const msgs=[];let lvl=null;
  n.forEach(e=>{if(e.k==='xp')xp+=e.n;else if(e.k==='msg')msgs.push(e.t);else if(e.k==='food')food+=e.n;else if(e.k==='lvl')lvl=lvl?{from:lvl.from,to:e.to,fz:lvl.fz+e.fz}:e});
  const parts=[];if(xp)parts.push('+'+xp+' XP');if(food)parts.push('+'+food+' корма');if(msgs.length>3)parts.push('Новые награды: '+msgs.length);else msgs.forEach(m=>parts.push(m));UI.fxJob=((xp||lvl)&&fxMode()!=='off')?{xp:xp}:null;if(parts.length)toast(parts.join(' · '),!!(UI.fxJob&&!msgs.length));
  if(lvl){UI.pendingLvl=lvl;playSfx('up')}else if(msgs.some(m=>m.indexOf('Достижение')===0))playSfx('ach');else if(xp)playSfx('coin')}
function curPct(){const l=levelInfo(S.xp);return{L:l.L,p:l.need?l.cur/l.need:0}}
function fxMode(){if(S.calm)return 'off';try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return 'off'}catch(e){}return(S.fx==='off'||S.fx==='soft')?S.fx:'full'}
/* Отклик на запись. Одинаковый для любой суммы: награда за факт записи, а не за размер траты. */
function runFx(pv){const j=UI.fxJob;UI.fxJob=null;const org=UI.fxOrg;UI.fxOrg=null;
  try{if(!j||!document.getElementById)return;const m=fxMode();if(m==='off')return;
    const L=document.getElementById('fx');if(!L||!L.appendChild)return;
    const W=window.innerWidth||360,H=window.innerHeight||640;
    const o=org?{x:Math.min(Math.max(org.x,24),W-24),y:Math.min(Math.max(org.y,24),H-24)}:{x:W/2,y:H-130};
    const bar=document.querySelector('.hero .bar,.herostrip .bar'),art=document.querySelector('.hero-art,.hs-art'),pet=document.querySelector('.pet-art');
    let tx=W/2,ty=70;
    if(bar&&bar.getBoundingClientRect){const r=bar.getBoundingClientRect();if(r.top>20&&r.top<H-20){tx=r.left+r.width/2;ty=r.top+r.height/2}}
    const n=j.xp>0?(m==='full'?7:3):2,dur=m==='full'?760:620,col=['#e2b24a','#f0d27a','#d0605a','#ece4d2'];
    while(L.childNodes.length>24)L.removeChild(L.firstChild);
    for(let i=0;i<n;i++){const d=document.createElement('div');d.className='fxp';const sz=i%3===0?8:6;
      d.style.width=d.style.height=sz+'px';d.style.background=col[i%col.length];L.appendChild(d);
      const bx=o.x+(Math.random()-.5)*80,by=o.y-18-Math.random()*34;
      if(!d.animate){L.removeChild(d);continue}
      const a=d.animate([{transform:'translate('+o.x+'px,'+o.y+'px)',opacity:1,offset:0},
        {transform:'translate('+bx+'px,'+by+'px)',opacity:1,offset:.38,easing:'steps(5)'},
        {transform:'translate('+tx+'px,'+ty+'px)',opacity:.3,offset:1}],{duration:dur,delay:i*45,easing:'steps(7)',fill:'both'});
      a.onfinish=()=>{if(d.parentNode)d.parentNode.removeChild(d)}}
    if(j.xp>0){const t=document.createElement('div');t.className='fxt';t.textContent='+'+j.xp+' XP';
      t.style.left=Math.max(8,Math.min(o.x-28,W-90))+'px';t.style.top=(o.y-30)+'px';L.appendChild(t);
      if(t.animate){const a=t.animate([{transform:'translateY(0)',opacity:1,offset:0},{transform:'translateY(-14px)',opacity:1,offset:.6},{transform:'translateY(-40px)',opacity:0}],{duration:950,easing:'steps(9)',fill:'both'});
        a.onfinish=()=>{if(t.parentNode)t.parentNode.removeChild(t)}}}
    const hit=dur-120;
    if(art&&art.animate)art.animate([{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'},{transform:'translateY(-3px)'},{transform:'translateY(0)'}],{duration:480,delay:hit,easing:'steps(5)'});
    if(m==='full'&&pet&&pet.animate)pet.animate([{transform:'translateY(0)'},{transform:'translateY(-7px)'},{transform:'translateY(0)'}],{duration:360,delay:hit+120,easing:'steps(4)'});
    if(bar&&bar.animate){const c=curPct();
      bar.animate([{filter:'brightness(1)'},{filter:'brightness(1.9)'},{filter:'brightness(1)'}],{duration:420,delay:hit,easing:'steps(3)'});
      const fill=bar.firstElementChild;
      if(fill&&fill.animate&&pv&&pv.L===c.L&&c.p>pv.p)fill.animate([{width:(pv.p*100)+'%'},{width:(c.p*100)+'%'}],{duration:480,delay:hit,easing:'steps(8)',fill:'backwards'})}
  }catch(e){}}

/* Переключатели (.seg, .segb, периоды): стеклянная «капля» плавно едет к выбранному, её можно тянуть пальцем */
function segPills(){try{document.querySelectorAll('.seg,.segb').forEach(g=>{const on=g.querySelector(':scope>button.on,:scope>.on');let p=g.querySelector(':scope>.segpill');
  if(!on){if(p)p.remove();return}
  if(!p){p=document.createElement('i');p.className='segpill';g.insertBefore(p,g.firstChild);const prev=UI.segPrev&&UI.segPrev[segKey(g)];if(prev){p.style.transition='none';p.style.left=prev[0]+'px';p.style.width=prev[1]+'px';void p.offsetWidth;p.style.transition=''}}
  g.classList.add('hasPill');const L=on.offsetLeft,W=on.offsetWidth;p.style.left=L+'px';p.style.width=W+'px';p.style.top=on.offsetTop+'px';p.style.height=on.offsetHeight+'px';
  (UI.segPrev=UI.segPrev||{})[segKey(g)]=[L,W]})}catch(e){}}
function segKey(g){return (g.className||'')+'|'+[].map.call(g.querySelectorAll(':scope>button'),b=>b.dataset.act||'').join(',')}
function bootSeg(){window.addEventListener('resize',()=>setTimeout(segPills,60));return;let g=null,p=null,x0=0,l0=0,moved=false,btns=[];
  document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.hasPill');if(!t)return;g=t;p=g.querySelector(':scope>.segpill');if(!p){g=null;return}
    btns=[].slice.call(g.querySelectorAll(':scope>button'));x0=e.clientX;l0=p.offsetLeft;moved=false},{passive:true});
  document.addEventListener('pointermove',e=>{if(!g)return;const dx=e.clientX-x0;if(!moved&&Math.abs(dx)<8)return;moved=true;g.classList.add('drag');
    const max=g.scrollWidth-p.offsetWidth;p.style.left=Math.max(0,Math.min(max,l0+dx))+'px';
    const c=p.offsetLeft+p.offsetWidth/2;let best=null,bd=1e9;btns.forEach(b=>{const d=Math.abs(b.offsetLeft+b.offsetWidth/2-c);if(d<bd){bd=d;best=b}});
    if(best){const w=best.offsetWidth;p.style.width=w+'px';btns.forEach(b=>b.classList.toggle('hov',b===best))}},{passive:true});
  const up=()=>{if(!g)return;const G=g;g=null;G.classList.remove('drag');if(!moved)return;const best=btns.find(b=>b.classList.contains('hov'));btns.forEach(b=>b.classList.remove('hov'));
    if(best&&!best.classList.contains('on')){UI.segSkipClick=Date.now();best.click()}else segPills()};
  document.addEventListener('pointerup',up,{passive:true});document.addEventListener('pointercancel',up,{passive:true});
  window.addEventListener('resize',()=>setTimeout(segPills,60))}

function chartSVG(st){

  let o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Доходы и расходы по периодам">';
  [0,0.5,1].forEach(f=>{const y=T+ph-ph*f;o+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(L-5)+'" y="'+(y+3.5)+'" text-anchor="end">'+ylab[[0,0.5,1].indexOf(f)]+'</text>'});
  const step=Math.ceil(bk.length/(bk.length>12?8:12));
  bk.forEach((b,i)=>{const cx=L+gw*i+gw/2;const he=Math.max(b.exp>0?1:0,ph*b.exp/top),hi=Math.max(b.inc>0?1:0,ph*b.inc/top);
    o+='<rect class="b-inc" x="'+(cx-bw-0.5)+'" y="'+(T+ph-hi)+'" width="'+bw+'" height="'+hi+'"/><rect class="b-exp" x="'+(cx+0.5)+'" y="'+(T+ph-he)+'" width="'+bw+'" height="'+he+'"/>';
    if(i%step===0)o+='<text class="tx" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(b.label)+'</text>'});
  return o+'</svg>'}

function habitsCard(){const t=today(),from=addDays(t,-29);const m={};let tot=0;
  S.tx.forEach(x=>{if(x.type!=='exp'||x.date<from||x.date>t||x.cat==='xfer'||x.cat==='credit')return;tot++;const c=m[x.cat]||(m[x.cat]={n:0,s:0,d:{}});c.n++;c.s+=x.amount;c.d[x.date]=1});
  if(tot<10)return '';

/* PDF.js: сначала своя копия в assets/pdfjs (если положена), потом три CDN по очереди */
const PDFJS_SRC=['assets/pdfjs/','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/','https://unpkg.com/pdfjs-dist@3.11.174/build/'];
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  const tryAt=i=>new Promise((ok,no)=>{if(i>=PDFJS_SRC.length){no(new Error('load'));return}const base=PDFJS_SRC[i];
    const sc=document.createElement('script');sc.src=base+'pdf.min.js';
    sc.onload=()=>{if(window.pdfjsLib){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'}catch(e){}ok(window.pdfjsLib)}else tryAt(i+1).then(ok,no)};
    sc.onerror=()=>{try{sc.remove()}catch(e){}tryAt(i+1).then(ok,no)};document.head.appendChild(sc)});
  return tryAt(0)}
async function pdfToText(buf){const lib=await loadPdfJs();const doc=await lib.getDocument({data:buf}).promise;const pages=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();
    pages.push(tc.items.map(it=>({str:it.str,x:it.transform[4],y:it.transform[5]})))}
  return pdfItemsToText(pages)}
function readStatementFile(file){const F=UI.form;if(!file||!F)return;F.err='';F.busy=true;renderSheet();
  const fail=m=>{F.busy=false;F.err=m;renderSheet()};
  const rd=new FileReader();rd.onerror=()=>fail('Не получилось открыть файл');
  rd.onload=()=>{parseStatementBuf(rd.result).then(res=>{F.busy=false;F.text=res.text||'';impShow(res)}).catch(e=>{const m=String(e&&e.message);
    fail(m==='pdf'?'Не получилось прочитать PDF. Для этого нужен интернет. Попробуй ещё раз.':m==='xls'?'Это старый формат Excel (.xls). Открой файл и сохрани как .xlsx или CSV.':m==='xlsx'?'Не получилось открыть Excel-файл. Попробуй сохранить его как CSV.':'Не получилось прочитать файл')})};
  rd.readAsArrayBuffer(file)}
function impShow(res){const F=UI.form;const rows=res.rows||[];
  if(!rows.length){F.err='Не нашёл операций в файле. Подходят: PDF, CSV, Excel (.xlsx), OFX/QFX, QIF, MT940, CAMT.053. Если банк даёт выписку в Excel или CSV — лучше её.';return renderSheet()}
  F.fmt=res.fmt;F.allPos=!!(rows.meta&&rows.meta.allPos);F.rows=rows;F.plan=planImport(rows,F);F.step=2;renderSheet()}
function sheetImp(){const F=UI.form;
  if(F.step===2&&F.plan){const P=F.plan;const ex=P.items.filter(i=>i.type==='exp'),inc=P.items.filter(i=>i.type==='inc');
    const sum=a=>a.reduce((q,i)=>q+i.amount,0);const sk=P.skip;const skN=(sk.internal||0)+(sk.cash||0)+(sk.other||0);
    const cats={};ex.forEach(i=>{if(i.cat){const c=cats[i.cat]||(cats[i.cat]={n:0,s:0});c.n++;c.s+=i.amount}});
    const top=Object.keys(cats).sort((a,b)=>cats[b].s-cats[a].s).slice(0,6);
    const nc=Object.keys(P.nocur||{});
    let h=shHead('Проверь список')+(F.fmt?'<p class="note">Формат: '+esc(F.fmt)+'</p>':'')+'<p class="sub">Найдено в выписке: '+F.rows.length+'. Добавим '+P.items.length+': расходов '+ex.length+' на '+fmt(sum(ex))+', доходов '+inc.length+' на '+fmt(sum(inc))+'.</p>';
    if(skN)h+='<p class="note">Пропущено '+skN+': переводы между своими счетами.</p>';
    if(P.dups)h+='<p class="note">Уже были добавлены раньше: '+P.dups+'.</p>';
    if(nc.length)h+='<p class="err">Нет курса для '+nc.join(', ')+': пропущено '+nc.reduce((q,k)=>q+P.nocur[k],0)+'.</p><button class="btn ghost small" data-act="impfx">Обновить курсы</button>';
    if(F.allPos)h+='<p class="note">В файле у сумм нет знаков «+» и «−». Поступления я узнал по словам, остальное считаю расходами. Проверь список.</p>';
    h+='<div class="fchips"><button class="fc'+(F.tx?' on':'')+'" data-act="imptoggle" data-v="tx">Переводы людям: '+(F.tx?'считать расходом':'не считать')+'</button><button class="fc'+(F.inc?' on':'')+'" data-act="imptoggle" data-v="inc">Пополнения от людей: '+(F.inc?'считать доходом':'не считать')+'</button></div>';
    if(top.length)h+='<div class="label">Куда уходят деньги</div>'+top.map(k=>{const ci=catInfo(k);return '<div class="catrow"><span>'+ci.icon+' '+esc(ci.name)+'</span><span class="amt">'+fmt(cats[k].s)+' · '+cats[k].n+'</span></div>'}).join('');
    if(P.unknown.length){h+='<div class="label">Незнакомые места</div><p class="note">Выбери категорию один раз, приложение запомнит. Остальные попадут в «Прочее».</p>';
      P.unknown.slice(0,8).forEach(u=>{h+='<div class="field"><label>'+esc(u.name)+' · '+u.n+' '+plural(u.n,['раз','раза','раз'])+' · '+fmt(u.sum)+'</label><select class="inp" data-mk="'+esc(u.key)+'" aria-label="Категория для '+esc(u.name)+'">'
        +catsFor('exp').map(c=>'<option value="'+c.id+'"'+((F.map[u.key]||'other')===c.id?' selected':'')+'>'+(c.emo||c.icon)+' '+esc(c.name)+'</option>').join('')+'<option value="__new">➕ Своя категория…</option></select>'
        +(F.newFor===u.key?'<div class="two" style="margin-top:8px"><div class="field"><label for="ncI">Значок</label><input id="ncI" class="inp" data-f="ncicon" maxlength="4" value="'+esc(F.ncicon||'')+'" placeholder="☕"></div><div class="field"><label for="ncN">Название</label><input id="ncN" class="inp" data-f="ncname" maxlength="20" value="'+esc(F.ncname||'')+'" placeholder="Кофе"></div></div><button class="btn small" style="margin-top:8px" data-act="impcat" data-v="'+esc(u.key)+'">Добавить категорию</button>':'')+'</div>'})}
    return h+'<button class="btn" data-act="impgo"'+(P.items.length?'':' disabled')+'>Добавить '+P.items.length+'</button><button class="btn ghost" data-act="impback">Назад</button>'}
  return shHead('Загрузить историю')
   +'<p class="note">Читается только на этом телефоне. Хранятся дата, сумма и место.</p>'
   +'<p class="sub">Скачай выписку в приложении банка и выбери файл. Лучше всего подходят Excel и CSV.</p>'
   +'<p class="note">Kaspi — PDF. Другие банки — CSV, Excel (.xlsx), OFX/QFX, QIF, MT940, CAMT.053 или PDF (по возможности).</p>'
   +'<div class="field"><label for="ixa">К какому счёту относится выписка</label><select id="ixa" class="inp" data-f="acc">'+accOpts(F.acc)+'</select></div>'
   +(F.busy?'<p class="sub">Читаю файл…</p>'
     :'<label class="btn" for="ixf" style="display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center">Выбрать файл выписки</label><input id="ixf" type="file" data-file="1" style="position:absolute;opacity:0;width:1px;height:1px">')
   +(F.err?'<p class="err">'+esc(F.err)+'</p>':'')
   +'<button class="fc" style="align-self:flex-start" data-act="imppaste">'+(F.paste?'Скрыть ввод текста':'Или вставить текст')+'</button>'
   +(F.paste?'<div class="field"><label for="ixt">Текст выписки</label><textarea id="ixt" class="inp" style="min-height:120px" data-f="text" placeholder="Вставь сюда текст выписки">'+esc(F.text)+'</textarea></div><button class="btn ghost" data-act="impparse">Разобрать текст</button>':'')}

function sheetTx(){const x=S.tx.find(t=>t.id===UI.sheet.id);if(!x)return shHead('Запись')+'<p>Запись не найдена.</p>';
  const del=(UI.confirm===x.id?'<p class="err">Удалить запись? Баланс счёта пересчитается. XP останется.</p><div class="two"><button class="btn ghost" data-act="close">Оставить</button><button class="btn danger" data-act="txdel" data-v="'+x.id+'">Да, удалить</button></div>'
     :'<button class="btn danger" data-act="txdel" data-v="'+x.id+'">Удалить запись</button>');
  if(x.type==='tr'){const c={icon:'⇄',name:'Перевод'};
    return shHead('Запись')+'<div class="row" style="cursor:default"><span class="tile">'+c.icon+'</span><span class="mid"><div class="t1">'+esc(x.note||c.name)+'</div><div class="t2">'+esc(c.name)+' · '+fmtDate(x.date)+'</div></span><span class="amt">'+fmt(x.amount)+'</span></div>'
     +'<p class="note">'+esc(accName(x.acc))+' → '+esc(accName(x.to))+'</p>'+del}
  const E=UI.E&&UI.E.id===x.id?UI.E:(UI.E=newE(x));

  let h=shHead('Запись')+(x.hist?'<p class="note">Из архива (выписка). Баланс счёта от правок не меняется.</p>':'')
   +'<div class="amtwrap"><input id="eamt" class="amount" data-f="amount" inputmode="decimal" autocomplete="off" aria-label="Сумма" value="'+esc(E.amount)+'"><span>'+(E.ocur?curInfo(E.ocur).sym:'₸')+'</span></div>'+(E.ocur?'<p class="sub curhint">Курс записи: 1 '+E.ocur+' = '+fmt(x.amount/x.oamt)+'. Сумма в тенге пересчитается по нему.</p>':'')
   +'<div class="label">Категория</div><div class="cats">'+catsFor(x.type).map(c=>'<button class="cat '+(E.cat===c.id?'on':'')+'" data-act="ecat" data-v="'+c.id+'"><span class="ci">'+c.icon+'</span><span>'+esc(c.name)+'</span></button>').join('')
   +'<button class="cat dashed" data-act="ecustomtoggle"><span class="ci">+</span><span>Своя</span></button></div>';
  if(E.custom)h+='<div class="two"><div class="field"><label for="eci">Значок</label><input id="eci" class="inp" data-f="cicon" maxlength="4" value="'+esc(E.cicon)+'" placeholder="☕"></div>'
    +'<div class="field"><label for="ecn">Название</label><input id="ecn" class="inp" data-f="cname" maxlength="20" value="'+esc(E.cname)+'" placeholder="Кофе"></div></div><button class="btn ghost small" data-act="ecustomsave">Создать категорию</button>';
  if(sim>0)h+='<div class="fchips"><button class="fc'+(E.all?' on':'')+'" data-act="eall">Для всех похожих: '+esc(x.note)+' ('+sim+')</button></div>';
  h+='<button class="fc" style="align-self:flex-start" data-act="emore">'+(E.more?'Скрыть дату, счёт и заметку':'Дата, счёт и заметка')+'</button>';
  if(E.more)h+='<div class="two"><div class="field"><label for="ed">Дата</label><input id="ed" class="inp" type="date" data-f="date" max="'+today()+'" value="'+esc(E.date)+'"></div>'
    +'<div class="field"><label for="eac">Счёт</label><select id="eac" class="inp" data-f="acc">'+accOpts(E.acc)+'</select></div></div>'
    +'<div class="field"><label for="en">Заметка</label><input id="en" class="inp" data-f="note" maxlength="60" value="'+esc(E.note)+'" placeholder="Что именно"></div>';
  if(E.err)h+='<p class="err">'+esc(E.err)+'</p>';

function mageSVG(){let o='';const r=(x,y,w,h,c)=>{o+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>'};
  const hat='#5b3d9a',hatd='#43307a',skin='#e0b48a',bd='#e8e4dc',robe='#3b2f6b';
  r(3,15,8,1,'rgba(0,0,0,.35)');
  r(12,2,1,13,'#6b4a2b');r(11,0,3,2,'#8fd3ef');r(12,0,1,1,'#e9fbff');
  r(3,9,8,6,robe);r(2,10,1,4,robe);r(11,10,1,3,robe);r(6,12,2,3,'#e2b24a');
  r(12,12,1,1,skin);r(1,13,1,1,skin);
  r(4,5,6,3,skin);r(5,6,1,1,'#1a1620');r(8,6,1,1,'#1a1620');r(6,7,2,1,'#c98f6a');
  r(5,5,2,1,bd);r(8,5,2,1,bd);r(4,7,2,1,bd);r(8,7,2,1,bd);
  r(4,8,6,2,bd);r(5,10,4,1,bd);r(6,11,2,1,bd);
  r(6,0,2,1,hat);r(5,1,4,1,hat);r(4,2,6,1,hat);r(6,2,1,1,'#e2b24a');r(3,3,8,1,hatd);r(2,4,10,1,hat);
  return '<svg viewBox="0 0 14 16" shape-rendering="crispEdges" aria-hidden="true">'+o+'</svg>'}

function kw(t,ch){t=esc(t);const sp=x=>ch?x.replace(/&#?\w+;|[^\s]/g,c=>'<i>'+c+'</i>'):x;let o='',last=0,m;const re=/\{([ygrb]) ([^}]+)\}/g;
  while((m=re.exec(t))){o+=sp(t.slice(last,m.index))+'<b class="k'+m[1]+'">'+sp(m[2])+'</b>';last=re.lastIndex}return o+sp(t.slice(last))}

function saveTxForm(){const F=UI.F;const oamt=num(F.amount),cur=F.cur||BASE;

  if(amount==null){F.err='Нет курса '+cur+'. Подключись к интернету или выбери основную валюту';return renderSheet()}
  if(amount>MAXAMT){F.err='Слишком большая сумма: максимум 999 млрд '+bSym();return renderSheet()}
  if(F.type!=='tr'&&!F.cat)F.cat='none';

  if(!F.date||F.date>today()){F.err='Дата не может быть в будущем';return renderSheet()}
  addTx({type:F.type,amount:Math.round(amount*100)/100,cat:F.cat,acc:F.acc,to:F.type==='tr'?F.to:null,date:F.date,note:F.note,ocur:cur===BASE?null:cur,oamt:cur===BASE?null:oamt});

  const fc=f.cur||BASE;if(fc!==BASE&&!rateOf(fc)){f.err='Нет курса '+fc+'. Подключись к интернету';return renderSheet()}
  if(id){const a=S.accounts.find(x=>x.id===id);const used=S.tx.some(t=>t.acc===id||t.to===id);

    const cur=accBalNative(a);a.bal0=(Number(a.bal0)||0)+(bal-cur);a.name=f.name.trim();a.type=f.type}
  else{const na={id:uid(),name:f.name.trim(),type:f.type,bal0:bal};if(fc!==BASE)na.cur=fc;S.accounts.push(na)}
