/* Клавиатура: окно остаётся на месте (верх фиксируем), клавиатура просто закрывает его низ */
function kbLock(t){try{const sc=t.closest('.scrim');if(!sc||UI.kbStop!=null)return;const sh=sc.querySelector('.sheet');if(!sh)return;const top=Math.max(0,Math.round(sh.getBoundingClientRect().top));UI.kbStop=top;UI.kbScroll=sh.scrollTop||0;sc.style.setProperty('--stop',top+'px');sc.classList.add('kblock')}catch(e){}}
function kbKeepScroll(){try{const sh=document.querySelector('#layer .sheet');if(!sh||UI.kbStop==null)return;const a=document.activeElement,prev=sh.scrollTop,to=UI.kbScroll||0;const go=v=>{try{sh.scrollTo({top:v,behavior:'instant'})}catch(e){sh.scrollTop=v}};go(to);
  const r=a&&a.getBoundingClientRect?a.getBoundingClientRect():null,vh=(window.visualViewport?window.visualViewport.height:window.innerHeight)||600;if(r&&(r.top<4||r.bottom>vh-4))go(prev)}catch(e){}}
function kbDoUnlock(){try{UI.kbWait=false;try{document.querySelectorAll('.sheet.kbpad').forEach(e=>e.classList.remove('kbpad'))}catch(x){}if(UI.kbStop==null)return;UI.kbStop=null;const sc=document.querySelector('#layer .scrim');if(!sc)return;const sh=sc.querySelector('.sheet');
  const before=sh?sh.getBoundingClientRect().top:0;sc.classList.remove('kblock');sc.style.removeProperty('--stop');
  if(sh){const d=before-sh.getBoundingClientRect().top;if(Math.abs(d)>1){sh.style.transition='none';sh.style.transform='translateY('+d+'px)';void sh.offsetHeight;sh.style.transition='transform .26s cubic-bezier(.25,.8,.3,1)';sh.style.transform='translateY(0)';setTimeout(()=>{try{sh.style.transition='';sh.style.transform=''}catch(e){}},320)}}}catch(e){}}
/* Поле ввода должно быть видно над клавиатурой: даём запас снизу и подтягиваем поле вверх */
function kbReveal(t){try{if(document.activeElement!==t)return;const sh=t.closest('.sheet');if(!sh)return;const vv=window.visualViewport,vh=Math.round(vv?vv.height:window.innerHeight)||600;
  const shrunk=vvMax-vh>100;const free=shrunk?vh:Math.round(vh*0.55);const r=t.getBoundingClientRect();
  if(r.bottom>free-14||r.top<8){const d=r.bottom-(free-24);sh.scrollTop=Math.max(0,sh.scrollTop+d)}}catch(e){}}
function kbDoneBtn(sh){try{if(sh.querySelector(':scope>.kbdone'))return;const b=document.createElement('button');b.className='kbdone';b.type='button';b.textContent='Скрыть клавиатуру ⌄';
  b.addEventListener('pointerdown',e=>e.preventDefault());b.addEventListener('click',()=>{try{const a=document.activeElement;if(a&&a.blur)a.blur()}catch(e){}});sh.insertBefore(b,sh.firstChild)}catch(e){}}
function kbUnlock(){try{if(UI.kbStop==null)return;kbDoUnlock()}catch(e){}}
let vvLast=0,vvMax=0,vvRaf=0;
function vvSync(){try{if(vvRaf)return;vvRaf=requestAnimationFrame(()=>{vvRaf=0;try{const v=window.visualViewport;const h=Math.round(v?v.height:window.innerHeight);if(h>vvMax)vvMax=h;if(Math.abs(h-vvLast)>=2){vvLast=h;document.documentElement.style.setProperty('--vvh',h+'px');if(UI.kbWait&&h>=vvMax-2)kbDoUnlock();if(UI.kbStop!=null){setTimeout(kbKeepScroll,40);setTimeout(kbKeepScroll,340)}}}catch(e){}})}catch(e){}}
function bootKb(){try{vvSync();if(window.visualViewport)window.visualViewport.addEventListener('resize',vvSync);window.addEventListener('resize',vvSync);
  document.addEventListener('focusout',()=>{setTimeout(()=>{try{const a=document.activeElement;if(!(a&&a.closest&&a.closest('.sheet')&&/INPUT|TEXTAREA/.test(a.tagName)))kbUnlock()}catch(e){}},250)});
  document.addEventListener('keydown',e=>{try{const t=e.target;if(e.key==='Enter'&&t&&t.tagName==='INPUT'&&t.closest&&t.closest('.sheet')){e.preventDefault();t.blur()}}catch(x){}});

/* Свайп между вкладками. Правша: влево = следующая; левша: зеркально. Допускаем дугу большого пальца (до ~35°). */
const TAB_ORDER=['home','list','plan','hero'];
function swipeHint(){if(S.swipeHint||!S.onboarded||!S.tourSeen||S.tx.length<1)return;S.swipeHint=true;save();setTimeout(()=>toast(S.lefty?'Подсказка: вкладки листаются свайпом вправо и влево':'Подсказка: листай вкладки пальцем влево и вправо'),1200)}
function swipeTab(dx){S.swipeHint=true;const i=TAB_ORDER.indexOf(tabGroup(UI.tab));let dir=dx<0?1:-1;if(S.lefty)dir=-dir;const j=i+dir;
  if(i<0||j<0||j>=TAB_ORDER.length)return false;UI.swipeDir=UI.swipeDir===0?0:dir;UI.tab=TAB_ORDER[j];UI.day=null;render();try{window.scrollTo(0,0)}catch(e){}tgHaptic();return true}
function bootSwipe(){let x0=null,y0=0,t0=0,lock=0,dx=0;const app=()=>document.getElementById('app');
  const skip=el=>{try{return UI.sheet||UI.tour!=null||UI.intro!=null||(el&&el.closest&&el.closest('input,select,textarea,.fchips,.qgrid,[style*="overflow-x"],.noswipe,#layer,#tourlayer,#tabbar'))}catch(e){return true}};
  const canGo=d=>{const i=TAB_ORDER.indexOf(tabGroup(UI.tab));let dir=d<0?1:-1;if(S.lefty)dir=-dir;const j=i+dir;return j>=0&&j<TAB_ORDER.length};
  const setX=(x,anim)=>{const a=app();if(!a)return;a.style.transition=anim?'transform .28s cubic-bezier(.22,.8,.3,1),opacity .28s':'none';a.style.transform=x?'translate3d('+x+'px,0,0)':'';a.style.opacity=''};
  document.addEventListener('touchstart',e=>{lock=0;dx=0;if(e.touches.length!==1||skip(e.target)){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();const W=window.innerWidth||400;if(x0<20||x0>W-20)x0=null},{passive:true});
  document.addEventListener('touchmove',e=>{if(x0==null)return;const t=e.touches[0];const mx=t.clientX-x0,my=t.clientY-y0;
    if(!lock){if(Math.abs(mx)<10&&Math.abs(my)<10)return;lock=Math.abs(mx)>Math.abs(my)*1.2?1:-1}
    if(lock!==1)return;if(e.cancelable)e.preventDefault();dx=mx;const free=canGo(dx);setX(free?dx:dx*0.25,false)},{passive:false});
  document.addEventListener('touchend',()=>{if(x0==null)return;x0=null;if(lock!==1){return}
    const W=window.innerWidth||400,fast=Math.abs(dx)/Math.max(1,Date.now()-t0)>0.45;
    if((Math.abs(dx)>W*0.22||(fast&&Math.abs(dx)>40))&&canGo(dx)){const out=dx<0?-W:W;setX(out*0.6,true);
      setTimeout(()=>{UI.swipeDir=0;swipeTab(dx);const a=app();if(!a)return;a.classList.remove('swap','swl','swr');setX(-out*0.35,false);void a.offsetWidth;setX(0,true);setTimeout(()=>{a.style.transition='';a.style.opacity=''},300)},150)}
    else setX(0,true)},{passive:true});
  document.addEventListener('touchcancel',()=>{if(x0!=null&&lock===1)setX(0,true);x0=null},{passive:true})}
/* Точки: нажать = перейти, вести пальцем по точкам = быстро листать */
function bootDots(){let on=false,rect=null;
  const pick=x=>{if(!rect)return;const n=TAB_ORDER.length,i=Math.max(0,Math.min(n-1,Math.floor((x-rect.left)/(rect.width/n))));const t=TAB_ORDER[i];
    if(t!==tabGroup(UI.tab)){UI.swipeDir=TAB_ORDER.indexOf(t)>TAB_ORDER.indexOf(tabGroup(UI.tab))?1:-1;UI.tab=t;render();tgHaptic()}};
  document.addEventListener('pointerdown',e=>{const d=e.target.closest&&e.target.closest('.tdots');if(!d)return;on=true;rect=d.getBoundingClientRect();},{passive:true});
  document.addEventListener('pointermove',e=>{if(on)pick(e.clientX)},{passive:true});
  const end=()=>{if(on){on=false;try{window.scrollTo(0,0)}catch(e){}}};document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end)}
function boot(){bootKb();try{bootSwipe();bootDots();bootSeg()}catch(e){}tgInit();preloadLoc();S=load();try{document.documentElement.lang=S.lang||'ru';if(S.lang==='en'){trCompile();trNode(document.body)}bootI18n()}catch(e){}if(window.__cloudMerged){window.__cloudMerged=false;setTimeout(()=>cloudPush(true),300)}setTimeout(checkUpdate,1500);setTimeout(()=>fetchRates(),2500);try{swipeHint()}catch(e){}if(S.onboarded)syncQuest();UI.pct=curPct();UI.tab='home';render();
  if(!S.onboarded){UI.form={name:S.name,cash:'',card:''};if(!S.lang)langPick();else startIntro()}else renderSheet();

function showFatal(e){let raw='';try{raw=localStorage.getItem(KEY)||''}catch(x){}

   +'<button class="btn ghost" style="margin-top:10px;width:100%" id="safe">Открыть без обучения и бонусов</button></section>';
