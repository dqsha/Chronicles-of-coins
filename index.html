<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хроника Монет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one narrow column, bottom tab bar, bottom sheets for input. Single dark world by choice. */
:root{
  --bg:#15121b;--panel:#1f1b28;--panel2:#292337;--line:#3d3552;--shadow:#0b090f;
  --ink:#ece4d2;--mute:#a199b3;
  --gold:#e2b24a;--gold-d:#9c7422;
  --inc:#86b863;--exp:#d0605a;
  --display:'Press Start 2P',ui-monospace,'Courier New',monospace;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
  --num:'Golos Text','Noto Sans','Segoe UI',system-ui,sans-serif;
  --panel-a:rgba(31,27,40,.94);--tint:#201a3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--tint) 0,transparent 440px);background-repeat:no-repeat;color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;font-synthesis:none;font-size:16px;line-height:1.5;margin:0;text-wrap:balance;letter-spacing:0}
p{margin:0}
#app{max-width:480px;margin:0 auto;padding-block:16px 130px;display:flex;flex-direction:column;gap:14px;min-width:0}
body.calm *{animation:none!important}
body.calm .f2{display:none}
body[data-tab="home"]{--tint:#1f1b3d}
body[data-tab="list"]{--tint:#2e2218}
body[data-tab="stats"]{--tint:#172046}
body[data-tab="wallet"]{--tint:#33270f}
.scene{position:relative;height:118px;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);overflow:hidden;background:var(--panel2)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .cap{position:absolute;left:0;bottom:0;max-width:78%;padding:6px 14px 6px 12px;background:rgba(21,18,27,.88);border-top:2px solid var(--line);border-right:2px solid var(--line)}
.scene .cap h1{font-size:16px;color:var(--gold);line-height:1.4}
.scene .cap .loc{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.scene .r{position:absolute;right:0;top:0;max-width:60%;padding:4px 10px;background:rgba(21,18,27,.84);border-left:2px solid var(--line);border-bottom:2px solid var(--line);font:600 12px var(--num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.card{background:var(--panel-a);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px;min-width:0}
.card h2{font-size:16px;margin-bottom:12px}
.label{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.big{font:700 32px/1.1 var(--num);font-variant-numeric:tabular-nums;margin-top:4px}
.neg{color:var(--exp)}.pos{color:var(--inc)}
.sub{font-size:14px;color:var(--mute);margin-top:6px}
.btn{font:600 15px var(--body);border:2px solid var(--gold-d);background:var(--gold);color:#271c06;padding:11px 14px;min-height:46px;
  box-shadow:0 4px 0 var(--gold-d);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:var(--panel2);color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 1px 0 var(--shadow)}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px}
.btn.danger{background:#5a2420;border-color:#8a3a33;color:#ffd9d4;box-shadow:0 4px 0 #2d100e}
.btn[disabled]{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.actions{display:grid;gap:10px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero-art{background:var(--panel2);border:2px solid var(--line);padding:6px;display:flex;justify-content:center}
.hero-art svg{display:block;width:104px;height:auto;animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.hero-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.lvl{font:400 16px/1.4 var(--display);color:var(--gold)}
.n{font-family:var(--num);font-weight:700}
.lvbig{text-align:center;font:400 24px/1.4 var(--display);color:var(--gold)}
.name{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:var(--panel2);border:2px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--gold);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.22) 6px 8px)}
.xpline{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.ic{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.ic svg{display:block}
.streak{display:flex;flex-direction:column;gap:3px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--panel2);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.list>.row:first-child{border-top:0}
.row .tile{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);font-size:20px}
.row .mid{flex:1;min-width:0}
.row .t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .t2{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font:600 15px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:6px 0 2px}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fc{background:var(--panel2);border:2px solid var(--line);padding:6px 11px;font-size:13px;cursor:pointer;min-height:34px}
.fc.on{border-color:var(--gold);color:var(--gold)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--mute);font:10px var(--body)}
.b-inc{fill:var(--inc)}.b-exp{fill:var(--exp)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel2);border:2px solid var(--line);padding:10px;min-width:0}
.kpi b{display:block;font:700 17px var(--num);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.catrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0}
.catrow .bar{grid-column:1/-1;height:10px}
.catrow .bar>i{background:var(--exp);background-image:none}
.empty{color:var(--mute);padding:14px 0;text-align:center;font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:4px;width:100%;max-width:480px}
.tab{background:none;border:0;color:var(--mute);font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:12px 0 8px;cursor:pointer}
.tab[aria-current="true"]{color:var(--gold)}
.plus{justify-self:center;width:54px;height:54px;margin-top:-22px;background:var(--gold);color:#271c06;border:2px solid var(--gold-d);
  box-shadow:0 4px 0 var(--gold-d);font:700 30px var(--body);cursor:pointer;line-height:1}
.plus:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,6,12,.74);display:flex;align-items:flex-end;justify-content:center;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.scrim.mid{align-items:center;padding:16px}
.sheet{background:var(--panel);border:2px solid var(--line);border-bottom:0;width:100%;max-width:480px;max-height:92%;overflow:auto;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.scrim.mid .sheet{border-bottom:2px solid var(--line);box-shadow:6px 6px 0 var(--shadow);max-height:88%}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h2{font-size:16px}
.x{background:var(--panel2);border:2px solid var(--line);width:38px;height:38px;font-size:22px;cursor:pointer;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--line)}
.seg button{background:var(--panel2);border:0;padding:10px 4px;cursor:pointer;font-weight:600;min-height:44px}
.seg button.on{background:var(--gold);color:#271c06}
.amtwrap{display:flex;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:0 14px}
.amount{flex:1;min-width:0;width:100%;background:none;border:0;font:700 40px var(--num);padding:10px 0;text-align:right;font-variant-numeric:tabular-nums}
.amtwrap span{font:700 28px var(--num);color:var(--gold);margin-left:8px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:2px solid var(--line);padding:8px 4px;font-size:12px;cursor:pointer;min-height:68px;min-width:0}
.cat .ci{font-size:24px;line-height:1.2}
.cat span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.on{border-color:var(--gold);background:#352d1c}
.cat.dashed{border-style:dashed;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--mute)}
.inp{background:var(--panel2);border:2px solid var(--line);padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea.inp{min-height:90px;resize:vertical;font:12px/1.4 ui-monospace,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--exp);font-size:13px}
.note{font-size:14px;color:var(--mute)}
.gear{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.gear .g{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 10px;min-height:40px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);cursor:pointer}
.gear .g.on{border-color:var(--gold);color:var(--gold);background:#352d1c}
.gear .g.lock{color:var(--mute);opacity:.6;cursor:default}
.slot{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.herobig{display:flex;justify-content:center;background:var(--panel2);border:2px solid var(--line);padding:10px}
.herobig svg{width:150px;height:auto}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,440px);
  background:var(--ink);color:#1b1722;padding:10px 14px;font-weight:600;font-size:14px;box-shadow:4px 4px 0 var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
#toast.q{opacity:0!important}
#fx{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:70;overflow:hidden}
.fxp{position:absolute;left:0;top:0;image-rendering:pixelated;will-change:transform}
.fxt{position:absolute;left:0;top:0;font:400 12px/1 var(--display);color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap;will-change:transform}
.sep{height:2px;background:var(--panel2);margin:2px 0}
.bar.thin{height:8px;margin-top:6px}
.amount:focus-visible{outline:0}
.amtwrap:focus-within{border-color:var(--gold)}
.mbtn{position:absolute;left:6px;top:6px;width:36px;height:36px;background:rgba(21,18,27,.84);border:2px solid var(--line);color:var(--mute);font:700 18px var(--body);cursor:pointer;line-height:1}
.mbtn.on{color:var(--gold);border-color:var(--gold-d)}
input[type=range]{width:100%;accent-color:var(--gold);min-height:32px}
.pet{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.pet-art{background:var(--panel2);border:2px solid var(--line);padding:6px;display:flex;justify-content:center}
.pet-art svg{display:block;width:88px;height:auto;animation:bob 1.8s steps(2) infinite}
.pet-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.pet-name{font:400 16px/1.4 var(--display);color:var(--gold)}
.q{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:2px solid var(--panel2);padding:10px 0;text-align:left;cursor:pointer;min-height:44px}
.q .ck{flex:none;width:22px;height:22px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:#12220a;background:var(--panel2)}
.q.done .ck{background:var(--inc);border-color:var(--inc)}
.q.done .qt{color:var(--mute);text-decoration:line-through}
.q:disabled{cursor:default}
.tv-block{position:fixed;inset:0;z-index:70;touch-action:none}
.tv-dim{position:fixed;inset:0;z-index:70;background:rgba(8,6,12,.8);pointer-events:none}
.tv-spot{position:fixed;z-index:71;border:2px solid var(--gold);box-shadow:0 0 0 9999px rgba(8,6,12,.8);pointer-events:none;animation:tvp 1s steps(2) infinite}
@keyframes tvp{50%{border-color:var(--gold-d)}}
.tv-box{position:fixed;z-index:72;left:12px;right:12px;max-width:456px;margin:0 auto;background:var(--panel);border:2px solid var(--gold-d);box-shadow:4px 4px 0 var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.tv-box.top{top:calc(12px + env(safe-area-inset-top,0px))}
.tv-box.bot{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.tv-top{display:flex;gap:12px;align-items:flex-start}
.tv-mage{flex:none;width:60px;background:var(--panel2);border:2px solid var(--line);padding:4px}
.tv-mage svg{display:block;width:100%;height:auto;animation:bob 1.6s steps(2) infinite}
.tv-name{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.tv-txt p{font-size:15px;line-height:1.45}
.tv-bar{display:flex;align-items:center;gap:8px}
.tv-skip{background:none;border:0;color:var(--mute);font-size:13px;padding:8px 0;cursor:pointer;text-decoration:underline}
.tv-n{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
@keyframes ff1{50%{opacity:0}}
@keyframes ff2{50%{opacity:1}}
.f1{animation:ff1 .9s steps(1) infinite}
.f2{opacity:0;animation:ff2 .9s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.f1,.f2{animation:none}.f2{display:none}.pet-art svg,.hero-art svg,.tv-mage svg,.tv-spot{animation:none}.btn,.plus{transition:none}}
</style>

<script>
// ==LOGIC==
const KEY='hronika-monet-v1';
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let NOW=null;
const today=()=>NOW||dstr(new Date());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
const mkey=s=>s.slice(0,7);
const dim=(y,m)=>new Date(y,m,0).getDate();
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const num=s=>{const v=parseFloat(String(s==null?'':s).replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:0};
const plural=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2]};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){const v=Math.round(n*100)/100;const a=Math.abs(v);
  const s=a.toLocaleString('ru-RU',{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2});
  return (v<0?'−':'')+s+' ₸'}
const short=v=>{const f=x=>String(Math.round(x*10)/10).replace('.',',');
  return v>=1e6?f(v/1e6)+' млн':v>=1e3?f(v/1e3)+' тыс':String(Math.round(v))};
const MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];

const CATS_EXP=[['food','Продукты','🛒'],['cafe','Кафе','🍔'],['taxi','Транспорт','🚕'],['home','Дом','🏠'],['health','Здоровье','💊'],
  ['clothes','Одежда','👕'],['fun','Отдых','🎮'],['comm','Связь','📱'],['gift','Подарки','🎁'],['other','Прочее','📦'],['credit','Кредит','💳'],['xfer','Переводы','🤝']];
const CATS_INC=[['salary','Зарплата','💰'],['side','Подработка','🛠️'],['giftin','Подарок','🎁'],['otherin','Прочее','📥']];
const ACC_TYPES={cash:['Наличные','💵'],card:['Карта','💳'],bank:['Счёт или депозит','🏦'],save:['Накопления','🐷']};

function defaults(){return{v:1,name:'Странник',onboarded:false,accounts:[],customCats:[],tx:[],mand:[],paid:{},equip:{},xp:0,
  streak:{count:0,last:null,freezes:1,best:0},noSpend:{},dayRec:{},lastAcc:null,
  goals:[],dayGoal:{},quest:{},questAll:false,questInit:false,tourSeen:false,questHidden:false,lastBackup:null,ach:{},pet:{food:2,xp:0,fedOn:null,name:'Уголёк'},sound:{sfx:true,music:false,vol:0.6},calm:false,fx:'full',rules:{},histM:0,histHide:false}}
let S=defaults();
let saveFailed=false;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r),d=defaults();
  return Object.assign(d,o,{streak:Object.assign(d.streak,o.streak||{})})}}catch(e){}return defaults()}
function save(){try{S.savedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}catch(e){saveFailed=true}cloudPush()}
/* Облако Telegram: данные привязаны к аккаунту Telegram. Режем JSON на куски по 3000 символов (лимит значения 4096). */
const CCH=3000;let cloudTimer=null,cloudN=0;
function tgCloud(){try{const w=window.Telegram&&window.Telegram.WebApp;return(w&&w.CloudStorage&&w.initData)?w.CloudStorage:null}catch(e){return null}}
function cloudPush(now){const cs=tgCloud();if(!cs)return;if(cloudTimer)clearTimeout(cloudTimer);
  const go=()=>{cloudTimer=null;try{const str=JSON.stringify(S),n=Math.ceil(str.length/CCH),o={};
    for(let i=0;i<n;i++)o['hm_'+i]=str.slice(i*CCH,(i+1)*CCH);o.hm_n=String(n);
    cs.setItems(o,()=>{});
    if(cloudN>n){const old=[];for(let i=n;i<cloudN;i++)old.push('hm_'+i);cs.removeItems(old,()=>{})}
    cloudN=n}catch(e){}};
  if(now)go();else cloudTimer=setTimeout(go,700)}
function cloudSync(done){const cs=tgCloud();if(!cs){done();return}
  let fin=false;const end=()=>{if(!fin){fin=true;done()}};setTimeout(end,3500);
  try{cs.getItem('hm_n',(e,nv)=>{const n=parseInt(nv,10);if(e||!(n>0)){end();return}
    const keys=[];for(let i=0;i<n;i++)keys.push('hm_'+i);
    cs.getItems(keys,(e2,vals)=>{try{if(e2||!vals){end();return}
      let str='';for(let i=0;i<n;i++){if(typeof vals['hm_'+i]!=='string'){end();return}str+=vals['hm_'+i]}
      const c=JSON.parse(str);let l=null;try{l=JSON.parse(localStorage.getItem(KEY)||'null')}catch(x){}
      if(!l||(c.savedAt||0)>(l.savedAt||0)){try{localStorage.setItem(KEY,str)}catch(x){window.__cloudData=str}}
      cloudN=n}catch(x){}end()})})}catch(e){end()}}
try{document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudPush(true)})}catch(e){}

/* ---------- level, gear ---------- */
const req=L=>40+15*(L-1);
function xpAtLevel(L){let s=0;for(let k=1;k<L;k++)s+=req(k);return s}
function levelInfo(xp){let L=1,rem=xp;while(rem>=req(L)&&L<99){rem-=req(L);L++}return{L:L,cur:rem,need:req(L)}}
const GEAR={
  weapon:[{n:'Палка странника',l:1},{n:'Ржавый меч',l:2},{n:'Стальной меч',l:8},{n:'Проклятый клинок',l:16}],
  armor:[{n:'Тряпьё',l:1},{n:'Кожаная куртка',l:4},{n:'Кольчуга',l:10},{n:'Латы стража',l:20}],
  helm:[{n:'Без шлема',l:1},{n:'Капюшон',l:3},{n:'Железный шлем',l:7},{n:'Рогатый шлем',l:14}],
  cloak:[{n:'Без плаща',l:1},{n:'Серый плащ',l:5},{n:'Багровый плащ',l:12}]};
const SLOTN={weapon:'Оружие',armor:'Броня',helm:'Шлем',cloak:'Плащ'};
function tier(slot,L){let t=0;GEAR[slot].forEach((g,i)=>{if(g.l<=L)t=i});return t}
function equippedTier(slot,L){const e=S.equip&&S.equip[slot];return(e!=null&&GEAR[slot][e]&&GEAR[slot][e].l<=L)?e:tier(slot,L)}
function setEquip(slot,i,L){if(!GEAR[slot]||!GEAR[slot][i]||GEAR[slot][i].l>L)return false;
  if(!S.equip)S.equip={};if(i===tier(slot,L))delete S.equip[slot];else S.equip[slot]=i;return true}
function unlockedBetween(a,b){const out=[];Object.keys(GEAR).forEach(s=>GEAR[s].forEach(g=>{if(g.l>a&&g.l<=b&&g.l>1)out.push(SLOTN[s]+': '+g.n)}));return out}
function nextUnlock(L){let best=null;Object.keys(GEAR).forEach(s=>GEAR[s].forEach(g=>{if(g.l>L&&(!best||g.l<best.l))best={l:g.l,n:g.n}}));return best}

function accBal(a){let b=Number(a.bal0)||0;
  for(const t of S.tx){if(t.type==='inc'&&t.acc===a.id)b+=t.amount;else if(t.type==='exp'&&t.acc===a.id)b-=t.amount;
    else if(t.type==='tr'){if(t.acc===a.id)b-=t.amount;if(t.to===a.id)b+=t.amount}}return b}

  return{paid:paid,dd:dd,overdue:!paid&&day>dd,left:dd-day}}

const say=t=>notes.push({k:'msg',t:t});
function gainXp(n,why){n=Math.round(n);if(n<=0)return;const b=levelInfo(S.xp).L;S.xp+=n;const a=levelInfo(S.xp).L;
  notes.push({k:'xp',n:n,why:why});
  if(a>b){let fz=0;for(let L=b+1;L<=a;L++){if(L%5===0&&S.streak.freezes<3){S.streak.freezes++;fz++}}notes.push({k:'lvl',from:b,to:a,fz:fz});petFood(3*(a-b))}}
function markActive(){const st=S.streak,t=today();if(st.last===t)return 0;
  if(!st.last){st.count=1}
  else{const d=dayDiff(st.last,t);
    if(d<=0)return 0;
    if(d===1)st.count++;
    else{const missed=d-1;
      if(st.freezes>=missed){st.freezes-=missed;st.count++;say('Заморозка спасла стрик: '+missed+' '+plural(missed,['пропущенный день','пропущенных дня','пропущенных дней']))}
      else st.count=1}}
  st.last=t;st.best=Math.max(st.best,st.count);
  if(st.count%7===0&&st.freezes<3){st.freezes++;say('Неделя подряд: получена заморозка стрика')}
  return 5+Math.min(st.count,20)}
function streakView(){const st=S.streak;if(!st.last)return{count:0,state:'new'};const d=dayDiff(st.last,today());
  if(d<=0)return{count:st.count,state:'ok'};if(d===1)return{count:st.count,state:'wait'};
  const missed=d-1;return st.freezes>=missed?{count:st.count,state:'frozen',missed:missed}:{count:0,state:'broken'}}
function addTx(o){const t=today();
  const tx={id:uid(),type:o.type,amount:o.amount,cat:o.cat||null,acc:o.acc,to:o.to||null,date:o.date||t,note:(o.note||'').trim(),mid:o.mid||null,ts:Date.now()};
  S.tx.push(tx);
  if(o.type==='tr')return tx;
  let xp=0;const n=S.dayRec[t]||0;if(n<5){S.dayRec[t]=n+1;xp=10}
  const b=markActive();
  if(o.type==='exp'&&tx.date===t&&S.noSpend[t]){delete S.noSpend[t];S.xp=Math.max(S.xp-10,xpAtLevel(levelInfo(S.xp).L));say('Отметка «трат не было» снята')}
  if(xp)gainXp(xp,'Запись');if(b)gainXp(b,'Бонус дня');questDone('tx');
  return tx}
function repeatList(kind){const lim=Date.now()-90*864e5,m={};
  S.tx.forEach(x=>{if(x.type!==kind||!x.cat||x.mid||x.ts<lim)return;const k=x.cat+'|'+x.amount+'|'+x.acc;

  return Object.keys(m).map(k=>m[k]).sort((a,b)=>b.n-a.n||b.ts-a.ts).slice(0,4)}

function addGoal(o){const g={id:uid(),name:o.name,icon:o.icon||'🎯',target:o.target,deadline:o.deadline||null,contribs:[],reached:false,closed:false,created:today()};
  S.goals.push(g);questDone('goal');return g}
function addContrib(id,amt){const g=S.goals.find(x=>x.id===id&&!x.closed);if(!g||!amt)return 0;const t=today();
  if(amt<0){amt=Math.max(amt,-Math.max(0,goalSaved(g)));if(!amt)return 0;g.contribs.push({id:uid(),amt:amt,date:t,ts:Date.now()});return amt}
  g.contribs.push({id:uid(),amt:amt,date:t,ts:Date.now()});
  if(!S.dayGoal[t]){S.dayGoal[t]=1;const b=markActive();gainXp(10,'Взнос в цель');if(b)gainXp(b,'Бонус дня');petFood(2)}
  if(!g.reached&&goalSaved(g)>=g.target){g.reached=true;say('Цель достигнута: '+g.name);
    if(!S.dayGoal['r'+t]){S.dayGoal['r'+t]=1;gainXp(50,'Цель достигнута')}}
  questDone('contrib');return amt}
function delContrib(gid,cid){const g=S.goals.find(x=>x.id===gid&&!x.closed);if(!g)return false;
  const i=g.contribs.findIndex(c=>c.id===cid);if(i<0)return false;
  if(goalSaved(g)-g.contribs[i].amt<0)return false;g.contribs.splice(i,1);return true}
function closeGoal(id,o){const g=S.goals.find(x=>x.id===id&&!x.closed);if(!g)return null;
  const amount=o.amount!=null?o.amount:Math.max(0,goalSaved(g));let tx=null;
  if(amount>0){tx={id:uid(),type:'exp',amount:amount,cat:o.cat||'other',acc:o.acc,to:null,date:today(),note:g.name,mid:null,ts:Date.now()};S.tx.push(tx)}
  g.closed=true;g.closedOn=today();g.spent=amount;return tx}
function delGoal(id){S.goals=S.goals.filter(g=>g.id!==id)}
function goalInfo(g){const saved=Math.max(0,goalSaved(g)),left=Math.max(0,g.target-saved);
  const pct=g.target>0?Math.min(100,Math.floor(saved/g.target*100)):0;const done=saved>=g.target;const t=today();
  let eta=null,onTrack=null,need=null,rate=0;
  const pos=g.contribs.filter(c=>c.amt>0).map(c=>c.date).sort();
  if(!done&&saved>0&&pos.length){const el=Math.max(7,dayDiff(pos[0],t));rate=saved/el;eta=addDays(t,Math.ceil(left/rate-1e-9))}
  if(g.deadline&&!done){const dl=dayDiff(t,g.deadline);if(dl>0){need=left/dl*30.4375;onTrack=eta?eta<=g.deadline:null}else onTrack=false}
  return{saved:saved,left:left,pct:pct,done:done,eta:eta,onTrack:onTrack,need:need,rate:rate}}

function monthsBack(n){const t=today();let y=+t.slice(0,4),m=+t.slice(5,7);const out=[];
  for(let i=0;i<n;i++){out.unshift(y+'-'+pad(m));m--;if(m===0){m=12;y--}}return out}
function buckets(period){const t=today();let list=[];
  if(period==='week'){for(let i=6;i>=0;i--){const d=addDays(t,-i);list.push({key:d,from:d,to:d,label:WD[parseD(d).getDay()]})}}
  else if(period==='month'){const y=+t.slice(0,4),m=+t.slice(5,7);
    for(let d=1;d<=dim(y,m);d++){const s=y+'-'+pad(m)+'-'+pad(d);list.push({key:s,from:s,to:s,label:String(d)})}}
  else{let keys;
    if(period==='half')keys=monthsBack(6);else if(period==='year')keys=monthsBack(12);
    else{let first=t;for(const x of S.tx)if(x.date<first)first=x.date;const fk=mkey(first);keys=monthsBack(36).filter(k=>k>=fk);if(!keys.length)keys=[mkey(t)]}
    list=keys.map((k,i)=>({key:k,from:k+'-01',to:k+'-31',label:MN[+k.slice(5)-1]+((i===0||k.endsWith('-01'))&&keys.length>12?' '+k.slice(2,4):'')}))}
  list.forEach(b=>{b.exp=0;b.inc=0});
  const monthly=list[0].key.length===7;const map={};list.forEach(b=>{map[b.key]=b});
  const cats={};let rec=0;
  for(const x of S.tx){if(x.type==='tr')continue;const b=map[monthly?mkey(x.date):x.date];if(!b)continue;
    if(x.type==='exp'){b.exp+=x.amount;cats[x.cat]=(cats[x.cat]||0)+x.amount}else b.inc+=x.amount;rec++}
  const from=list[0].from,to=list[list.length-1].to;
  const ns=Object.keys(S.noSpend).filter(d=>d>=from&&d<=to).length;
  return{list:list,exp:list.reduce((s,b)=>s+b.exp,0),inc:list.reduce((s,b)=>s+b.inc,0),cats:cats,rec:rec,ns:ns,monthly:monthly}}
function monthRecords(){const m={};for(const x of S.tx){if(x.type==='tr')continue;const k=mkey(x.date);
  if(!m[k])m[k]={k:k,exp:0,inc:0};if(x.type==='exp')m[k].exp+=x.amount;else m[k].inc+=x.amount}return Object.keys(m).map(k=>m[k])}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v)));const n=v/e;
  const s=[1,1.5,2,3,4,5,6,8,10].find(x=>x>=n-1e-9)||10;return s*e}

const MERCH=[
 [/YANDEX\.?\s?GO|YANGO|INDRIVE|BOLT|UBER|ТАКСИ|TAXI/i,'taxi'],
 [/YANDEX\.?\s?PLUS|APPLE\.COM|ITUNES|GOOGLE|NETFLIX|SPOTIFY|YOUTUBE|STEAM|PLAYSTATION|XBOX|OKKO|KINOPOISK/i,'fun'],
 [/ALTEL|BEELINE|KCELL|TELE2|ACTIV\b|KAZAKHTELECOM|КАЗАХТЕЛЕКОМ/i,'comm'],
 [/ФАРМ|АПТЕК|PHARM|DORI|ПОЛИКЛИН|КЛИНИК|CLINIC|MEDICAL/i,'health'],
 [/KFC|BURGER|COFFEE|КОФЕ|PIZZA|ПИЦЦ|DODO|STARBUCKS|CAFE|КАФЕ|РЕСТОРАН|SUSHI|СУШИ|GLOVO|WOLT/i,'cafe'],
 [/MAGNUM|SMALL|GALMART|ARBUZ|ЭКОНОМ|МАРКЕТ|MARKET|ГИПЕР|ПРОДУКТ|FIX PRICE/i,'food'],

function guessCat(det){for(let i=0;i<MERCH.length;i++)if(MERCH[i][0].test(det))return MERCH[i][1];return null}
function merchKey(det){return String(det||'').toUpperCase().replace(/["«»“”'*]/g,'').replace(/(^|\s)(ИП|ТОО|ООО|АО)(?=\s)/g,' ').replace(/\s+/g,' ').trim().slice(0,32)}
const KTYPES=['Перевод на свой','Поступление со','Покупка','Перевод','Пополнение','Снятие','Разное'];
function parseKaspi(text){
  const t=String(text||'').replace(/ /g,' ').replace(/[−–—]/g,'-');
  const re=/(?:^|\s)(\d{2})\.(\d{2})\.(\d{2})\s+([+-])\s*(\d[\d ]*,\d{2})/g;
  const hits=[];let m;
  while((m=re.exec(t)))hits.push({i:m.index,end:re.lastIndex,d:m[1],mo:m[2],y:m[3],sg:m[4],a:m[5]});
  const rows=[];
  hits.forEach((h,k)=>{
    let rest=t.slice(h.end,k+1<hits.length?hits[k+1].i:t.length);

function classifyRow(r,o){const a=r.amt,det=r.det,key=merchKey(det);

  if(r.type==='Поступление со')return skip('internal');
  if(r.type==='Снятие')return skip('cash');

  if(r.type==='Разное')return a<0?{kind:'exp',cat:'other',note:det,key:key}:{kind:'inc',cat:'otherin',note:det,key:key};
  if(a>0)return{kind:'inc',cat:'otherin',note:'Возврат: '+det,key:key};

    const base=r.date+'|'+r.amt+'|'+r.type+'|'+merchKey(r.det);seen[base]=(seen[base]||0)+1;const dk=base+'#'+seen[base];
    if(have[dk]){dups++;return}
    const it={date:r.date,amount:Math.abs(r.amt),type:c.kind,cat:c.cat,note:c.note,key:c.key,imp:dk};
    if(it.type==='exp'&&!it.cat){const m=o.map&&o.map[c.key];if(m)it.cat=m;else{it.unk=true;const u=unk[c.key]||(unk[c.key]={key:c.key,name:c.note,n:0,sum:0});u.n++;u.sum+=it.amount}}
    items.push(it)});
  return{items:items,skip:skip,dups:dups,unknown:Object.keys(unk).map(k=>unk[k]).sort((a,b)=>b.sum-a.sum)}}

function saveTxEdit(E){const x=S.tx.find(t=>t.id===E.id);if(!x||x.type==='tr')return{ok:false,err:'Запись не найдена'};

/* Отклик на запись. Одинаковый для любой суммы: награда за факт записи, а не за размер траты. */
function runFx(pv){const j=UI.fxJob;UI.fxJob=null;const org=UI.fxOrg;UI.fxOrg=null;
  try{if(!j||!document.getElementById)return;const m=fxMode();if(m==='off')return;
    const L=document.getElementById('fx');if(!L||!L.appendChild)return;
    const W=window.innerWidth||360,H=window.innerHeight||640;
    const o=org?{x:Math.min(Math.max(org.x,24),W-24),y:Math.min(Math.max(org.y,24),H-24)}:{x:W/2,y:H-130};
    const bar=document.querySelector('.hero .bar'),art=document.querySelector('.hero-art'),pet=document.querySelector('.pet-art');
    let tx=W/2,ty=70;
    if(bar&&bar.getBoundingClientRect){const r=bar.getBoundingClientRect();if(r.top>20&&r.top<H-20){tx=r.left+r.width/2;ty=r.top+r.height/2}}
    const n=j.xp>0?(m==='full'?7:3):2,dur=m==='full'?760:620,col=['#e2b24a','#f0d27a','#d0605a','#ece4d2'];
    while(L.childNodes.length>24)L.removeChild(L.firstChild);
    for(let i=0;i<n;i++){const d=document.createElement('div');d.className='fxp';const sz=i%3===0?8:6;
      d.style.width=d.style.height=sz+'px';d.style.background=col[i%col.length];L.appendChild(d);
      const bx=o.x+(Math.random()-.5)*80,by=o.y-18-Math.random()*34;
      if(!d.animate){L.removeChild(d);continue}
      const a=d.animate([{transform:'translate('+o.x+'px,'+o.y+'px)',opacity:1,offset:0},
        {transform:'translate('+bx+'px,'+by+'px)',opacity:1,offset:.38,easing:'steps(5)'},
        {transform:'translate('+tx+'px,'+ty+'px)',opacity:.3,offset:1}],{duration:dur,delay:i*45,easing:'steps(7)',fill:'both'});
      a.onfinish=()=>{if(d.parentNode)d.parentNode.removeChild(d)}}
    if(j.xp>0){const t=document.createElement('div');t.className='fxt';t.textContent='+'+j.xp+' XP';
      t.style.left=Math.max(8,Math.min(o.x-28,W-90))+'px';t.style.top=(o.y-30)+'px';L.appendChild(t);
      if(t.animate){const a=t.animate([{transform:'translateY(0)',opacity:1,offset:0},{transform:'translateY(-14px)',opacity:1,offset:.6},{transform:'translateY(-40px)',opacity:0}],{duration:950,easing:'steps(9)',fill:'both'});
        a.onfinish=()=>{if(t.parentNode)t.parentNode.removeChild(t)}}}
    const hit=dur-120;
    if(art&&art.animate)art.animate([{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'},{transform:'translateY(-3px)'},{transform:'translateY(0)'}],{duration:480,delay:hit,easing:'steps(5)'});
    if(m==='full'&&pet&&pet.animate)pet.animate([{transform:'translateY(0)'},{transform:'translateY(-7px)'},{transform:'translateY(0)'}],{duration:360,delay:hit+120,easing:'steps(4)'});
    if(bar&&bar.animate){const c=curPct();
      bar.animate([{filter:'brightness(1)'},{filter:'brightness(1.9)'},{filter:'brightness(1)'}],{duration:420,delay:hit,easing:'steps(3)'});
      const fill=bar.firstElementChild;
      if(fill&&fill.animate&&pv&&pv.L===c.L&&c.p>pv.p)fill.animate([{width:(pv.p*100)+'%'},{width:(c.p*100)+'%'}],{duration:480,delay:hit,easing:'steps(8)',fill:'backwards'})}
  }catch(e){}}

async function pdfToText(buf){const lib=await loadPdfJs();const doc=await lib.getDocument({data:buf}).promise;const pages=[];

function readStatementFile(file){const F=UI.form;if(!file||!F)return;F.err='';F.busy=true;renderSheet();

  const done=txt=>{F.busy=false;F.text=txt;const rows=parseKaspi(txt);
    if(!rows.length){F.err='В файле не нашёл операций. Нужна выписка по карте Kaspi Gold в PDF.';return renderSheet()}
    F.rows=rows;F.plan=planImport(rows,F);F.step=2;renderSheet()};

  const rd=new FileReader();
  rd.onerror=()=>fail('Не получилось открыть файл');
  rd.onload=()=>{if(!isPdf){done(String(rd.result||''));return}
    pdfToText(rd.result).then(done).catch(()=>fail('Не получилось прочитать PDF. Для этого нужен интернет. Попробуй ещё раз или вставь текст вручную.'))};

function mageSVG(){let o='';const r=(x,y,w,h,c)=>{o+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>'};
  const hat='#5b3d9a',hatd='#43307a',skin='#e0b48a',bd='#e8e4dc',robe='#3b2f6b';

  r(12,2,1,13,'#6b4a2b');r(11,0,3,2,'#8fd3ef');r(12,0,1,1,'#e9fbff');
  r(3,9,8,6,robe);r(2,10,1,4,robe);r(11,10,1,3,robe);r(6,12,2,3,'#e2b24a');
  r(12,12,1,1,skin);r(1,13,1,1,skin);

  r(5,5,2,1,bd);r(8,5,2,1,bd);r(4,7,2,1,bd);r(8,7,2,1,bd);
  r(4,8,6,2,bd);r(5,10,4,1,bd);r(6,11,2,1,bd);
  r(6,0,2,1,hat);r(5,1,4,1,hat);r(4,2,6,1,hat);r(6,2,1,1,'#e2b24a');r(3,3,8,1,hatd);r(2,4,10,1,hat);

   +'<div class="field"><label for="ba">Сколько заплатил, ₸</label><input id="ba" class="inp" data-f="amount" inputmode="decimal" value="'+esc(f.amount)+'"></div>'
   +'<div class="two"><div class="field"><label for="bc">Категория</label><select id="bc" class="inp" data-f="cat">'+catsFor('exp').map(c=>'<option value="'+c.id+'"'+(f.cat===c.id?' selected':'')+'>'+c.icon+' '+esc(c.name)+'</option>').join('')+'</select></div>'
   +'<div class="field"><label for="bk">Со счёта</label><select id="bk" class="inp" data-f="acc">'+accOpts(f.acc)+'</select></div></div>'
   +(f.err?'<p class="err">'+esc(f.err)+'</p>':'')+'<button class="btn" data-act="buysave">Списать и закрыть цель</button>'}
function sheetAch(){const n=ACH.filter(a=>S.ach[a[0]]).length;
  return head('Достижения')+'<p class="note">Открыто '+n+' из '+ACH.length+'. За каждое награда: 20 XP.</p><div class="list">'
   +ACH.map(a=>{const d=S.ach[a[0]];return '<div class="row" style="cursor:default;opacity:'+(d?1:.5)+'"><span class="tile">'+(d?a[3]:'🔒')+'</span><span class="mid"><div class="t1">'+esc(a[1])+'</div><div class="t2">'+esc(a[2])+(d?' · '+fmtDate(d):'')+'</div></span></div>'}).join('')+'</div>'}
function renderSheet(){const L=$('#layer');const sh=UI.sheet;
  if(!sh){L.innerHTML='';return}
  const body={add:sheetAdd,tx:sheetTx,acc:sheetAcc,mand:sheetMand,gear:sheetGear,lvl:sheetLvl,onboard:sheetOnboard,data:sheetData,ach:sheetAch,goal:sheetGoal,gdet:sheetGdet,contrib:sheetContrib,buy:sheetBuy,imp:sheetImp}[sh.kind]();
  const lock=sh.kind==='lvl'||sh.kind==='onboard';
  L.innerHTML='<div class="scrim'+(lock||sh.kind==='gear'?' mid':'')+'" data-lock="'+(lock?1:0)+'"><div class="sheet" role="dialog" aria-modal="true">'+body+'</div></div>';
  if(sh.kind==='add'&&UI.focus){UI.focus=false;const a=$('#amt');if(a)a.focus()}}

/* ---------- actions ---------- */
function newF(type){const acc=S.accounts.find(a=>a.id===S.lastAcc)?S.lastAcc:S.accounts[0].id;
  const to=(S.accounts.find(a=>a.id!==acc)||{}).id||null;
  return{type:type||'exp',amount:'',cat:null,acc:acc,to:to,date:today(),note:'',more:false,custom:false,cname:'',cicon:'',err:''}}
function saveTxForm(){const F=UI.F;const amount=num(F.amount);
  if(!(amount>0)){F.err='Введите сумму';return renderSheet()}
  if(F.type!=='tr'&&!F.cat){F.err='Выберите категорию';return renderSheet()}
  if(F.type==='tr'&&(!F.to||F.acc===F.to)){F.err=S.accounts.length<2?'Для перевода нужно два счёта':'Выберите два разных счёта';return renderSheet()}
  if(!F.date||F.date>today()){F.err='Дата не может быть в будущем';return renderSheet()}
  addTx({type:F.type,amount:amount,cat:F.cat,acc:F.acc,to:F.type==='tr'?F.to:null,date:F.date,note:F.note});
  S.lastAcc=F.acc;UI.sheet=null;commit()}
function openAcc(id){const a=S.accounts.find(x=>x.id===id);
  UI.form=a?{name:a.name,type:a.type,bal:String(Math.round(accBal(a)*100)/100),err:''}:{name:'',type:'card',bal:'',err:''};openSheet('acc',{id:id||null})}
function saveAcc(){const f=UI.form,id=UI.sheet.id;if(!f.name.trim()){f.err='Введите название';return renderSheet()}
  const bal=num(f.bal);
  if(id){const a=S.accounts.find(x=>x.id===id);const cur=accBal(a);a.bal0=(Number(a.bal0)||0)+(bal-cur);a.name=f.name.trim();a.type=f.type}
  else S.accounts.push({id:uid(),name:f.name.trim(),type:f.type,bal0:bal});
  UI.sheet=null;commit()}
function delAcc(){const id=UI.sheet.id;
  if(UI.confirm!=='acc'){UI.confirm='acc';return renderSheet()}
  if(S.accounts.length<2){UI.form.err='Нельзя удалить последний счёт';UI.confirm=null;return renderSheet()}
  if(S.tx.some(x=>x.acc===id||x.to===id)||S.mand.some(m=>m.acc===id)){UI.form.err='По счёту есть записи или платежи, удалить нельзя';UI.confirm=null;return renderSheet()}
  S.accounts=S.accounts.filter(a=>a.id!==id);UI.sheet=null;commit()}
function openMand(id){const m=S.mand.find(x=>x.id===id);
  UI.form=m?{name:m.name,amount:String(m.amount),day:String(m.day),cat:m.cat,acc:m.acc,err:''}:{name:'',amount:'',day:'1',cat:'home',acc:S.accounts[0].id,err:''};openSheet('mand',{id:id||null})}
function saveMand(){const f=UI.form,id=UI.sheet.id;const amount=num(f.amount),day=Math.round(num(f.day));
  if(!f.name.trim()){f.err='Введите название';return renderSheet()}
  if(!(amount>0)){f.err='Введите сумму';return renderSheet()}
  if(day<1||day>31){f.err='День месяца от 1 до 31';return renderSheet()}
  const o={name:f.name.trim(),amount:amount,day:day,cat:f.cat,acc:f.acc};
  if(id)Object.assign(S.mand.find(x=>x.id===id),o);else{S.mand.push(Object.assign({id:uid()},o));questDone('mand')}
  UI.sheet=null;commit()}
function act(a,el){const v=el.dataset.v;
  try{const r=el.getBoundingClientRect();UI.fxOrg={x:r.left+r.width/2,y:r.top+r.height/2}}catch(e){UI.fxOrg=null}
  switch(a){
    case 'imp':{const a=S.accounts.find(x=>x.id===S.lastAcc)||S.accounts[0];UI.form={text:'',acc:a.id,step:1,tx:true,inc:true,map:{},rows:null,plan:null,err:'',paste:false,busy:false};openSheet('imp');break}
    case 'impparse':{const F=UI.form;const rows=parseKaspi(F.text);if(!rows.length){F.err='Не нашёл операций. Скопируй таблицу из выписки Kaspi целиком и вставь сюда.';return renderSheet()}
      F.err='';F.rows=rows;F.plan=planImport(rows,F);F.step=2;renderSheet();break}
    case 'imppaste':UI.form.paste=!UI.form.paste;renderSheet();break;
    case 'imptoggle':{const F=UI.form;F[v]=!F[v];F.plan=planImport(F.rows,F);renderSheet();break}
    case 'impback':UI.form.step=1;renderSheet();break;
    case 'impgo':{const F=UI.form;const r=applyImport(F);UI.sheet=null;UI.tab='stats';UI.period='half';say('Добавлено операций: '+r.n);commit();break}
    case 'imphide':S.histHide=true;save();render();break;
    case 'rep':{const F=UI.F,r=(UI.rep||[])[+v];if(r&&F){F.cat=r.cat;F.amount=String(r.amount);if(S.accounts.find(x=>x.id===r.acc))F.acc=r.acc;F.note=r.note||'';F.err='';UI.focus=false;renderSheet()}break}
    case 'fx':S.fx=(v==='soft'||v==='off')?v:'full';save();renderSheet();fxDemo();break;
    case 'tab':UI.tab=v;render();window.scrollTo(0,0);break;
    case 'add':UI.F=newF();UI.focus=true;openSheet('add');break;
    case 'close':closeSheet();break;
    case 'ftype':{const F=UI.F;F.type=v;F.cat=null;F.err='';UI.focus=true;renderSheet();break}
    case 'cat':UI.F.cat=v;UI.F.err='';renderSheet();break;
    case 'customtoggle':UI.F.custom=!UI.F.custom;renderSheet();break;
    case 'customsave':{const F=UI.F;if(!F.cname.trim()){F.err='Введите название категории';return renderSheet()}
      const c={id:'c'+uid(),name:F.cname.trim(),icon:(F.cicon||'⭐').trim(),kind:F.type};S.customCats.push(c);F.cat=c.id;F.custom=false;F.cname='';F.cicon='';F.err='';save();renderSheet();break}
    case 'dayset':UI.F.date=addDays(today(),-(+v));renderSheet();break;
    case 'more2':UI.F.more=!UI.F.more;renderSheet();break;
    case 'save':saveTxForm();break;
    case 'nospend':if(noSpendToday())commit();else{flush();render()}break;
    case 'pay':payMand(v);commit();break;
    case 'gear':questDone('gear');save();flush();render();openSheet('gear');break;
    case 'equip':{const L=levelInfo(S.xp).L;if(setEquip(el.dataset.s,+v,L)){save();render();renderSheet()}break}
    case 'lvlok':UI.pendingLvl=null;UI.sheet=null;renderSheet();maybeTour();break;
    case 'filter':UI.filter=v;UI.limit=60;render();break;
    case 'period':UI.period=v;render();break;
    case 'more':UI.limit+=60;render();break;
    case 'txopen':{const x=S.tx.find(t=>t.id===v);UI.E=x&&x.type!=='tr'?newE(x):null;openSheet('tx',{id:v});break}
    case 'ecat':if(UI.E){UI.E.cat=v;UI.E.err='';renderSheet()}break;
    case 'ecustomtoggle':if(UI.E){UI.E.custom=!UI.E.custom;renderSheet()}break;
    case 'ecustomsave':{const E=UI.E,x=E&&S.tx.find(t=>t.id===E.id);if(!x)break;if(!E.cname.trim()){E.err='Введите название категории';return renderSheet()}
      const c={id:'c'+uid(),name:E.cname.trim(),icon:(E.cicon||'⭐').trim(),kind:x.type};S.customCats.push(c);E.cat=c.id;E.custom=false;E.cname='';E.cicon='';E.err='';save();renderSheet();break}
    case 'eall':if(UI.E){UI.E.all=!UI.E.all;renderSheet()}break;
    case 'emore':if(UI.E){UI.E.more=!UI.E.more;renderSheet()}break;
    case 'txsave':{const E=UI.E;if(!E)break;const r=saveTxEdit(E);if(!r.ok){E.err=r.err;return renderSheet()}
      UI.E=null;UI.sheet=null;toast(r.changed>1?'Сохранено. Категория изменена у записей: '+r.changed:'Сохранено');commit();break}
    case 'txdel':if(UI.confirm!==v){UI.confirm=v;renderSheet()}else{delTx(v);UI.sheet=null;UI.confirm=null;commit()}break;
    case 'accnew':openAcc(null);break;
    case 'accedit':openAcc(v);break;
    case 'accsave':saveAcc();break;
    case 'accdel':delAcc();break;
    case 'mandnew':openMand(null);break;
    case 'mandedit':openMand(v);break;
    case 'mandsave':saveMand();break;
    case 'manddel':{const id=UI.sheet.id;S.mand=S.mand.filter(m=>m.id!==id);Object.keys(S.paid).forEach(k=>{if(k.indexOf(id+'|')===0)delete S.paid[k]});UI.sheet=null;commit();break}
    case 'tour':startTour();break;
    case 'feed':if(feedPet()){playSfx('feed');commit()}break;
    case 'music':S.sound.music=!S.sound.music;save();musicSync();render();if(S.sound.music)toast('Музыка включена. Если не слышно, проверь беззвучный режим телефона');break;
    case 'calmtoggle':S.calm=!S.calm;save();musicSync();render();renderSheet();break;
    case 'sfxtoggle':S.sound.sfx=!S.sound.sfx;save();renderSheet();break;
    case 'musictoggle':S.sound.music=!S.sound.music;save();musicSync();render();renderSheet();break;
    case 'questhide':S.questHidden=true;commit();break;
    case 'ach':openSheet('ach');break;
    case 'tournext':if(UI.tour>=TOURS.length-1)endTour();else{UI.tour++;tourGo()}break;
    case 'tourprev':if(UI.tour>0){UI.tour--;tourGo(-1)}break;
    case 'tourend':endTour();break;
    case 'goalnew':UI.form={name:'',icon:'',target:'',deadline:'',err:''};openSheet('goal',{id:null});break;
    case 'goalopen':UI.form={err:''};openSheet('gdet',{id:v});break;
    case 'goaledit':{const g=S.goals.find(x=>x.id===v);if(!g)break;UI.form={name:g.name,icon:g.icon,target:String(g.target),deadline:g.deadline||'',err:''};openSheet('goal',{id:v});break}
    case 'goalsave':{const f=UI.form,id=UI.sheet.id;const target=num(f.target);
      if(!f.name.trim()){f.err='Введите название';return renderSheet()}
      if(!(target>0)){f.err='Введите сумму цели';return renderSheet()}
      if(f.deadline&&f.deadline<=today()){f.err='Срок должен быть в будущем';return renderSheet()}
      if(id){const g=S.goals.find(x=>x.id===id);Object.assign(g,{name:f.name.trim(),icon:(f.icon||'🎯').trim(),target:target,deadline:f.deadline||null});if(goalSaved(g)>=target)g.reached=true}
      else addGoal({name:f.name.trim(),icon:(f.icon||'🎯').trim(),target:target,deadline:f.deadline||null});
      UI.sheet=null;commit();break}
    case 'goaldel':if(UI.confirm!=='goal'){UI.confirm='goal';renderSheet()}else{delGoal(v);UI.sheet=null;UI.confirm=null;commit()}break;
    case 'qcontrib':{const g=mainGoal();if(g){UI.form={amount:'',mode:'in',err:''};openSheet('contrib',{id:g.id})}else{toast('Сначала создай цель');act('goalnew',el)}break}
    case 'contribopen':UI.form={amount:'',mode:'in',err:''};openSheet('contrib',{id:v});break;
    case 'cmode':UI.form.mode=v;UI.form.err='';renderSheet();break;
    case 'contribsave':{const f=UI.form,amt=num(f.amount);if(!(amt>0)){f.err='Введите сумму';return renderSheet()}
      const done=addContrib(UI.sheet.id,f.mode==='out'?-amt:amt);if(!done){f.err='В цели нечего забирать';return renderSheet()}
      UI.sheet=null;commit();break}
    case 'cdel':{if(delContrib(el.dataset.g,v)){save();render();renderSheet()}else{UI.form.err='Нельзя удалить: в цели станет меньше нуля';renderSheet()}break}
    case 'buyopen':{const g=S.goals.find(x=>x.id===v);if(!g)break;const acc=S.accounts.find(a=>a.id===S.lastAcc)?S.lastAcc:S.accounts[0].id;
      UI.form={amount:String(Math.max(0,goalSaved(g))||g.target),acc:acc,cat:'other',err:''};openSheet('buy',{id:v});break}
    case 'buysave':{const f=UI.form,amt=num(f.amount);if(!(amt>0)){f.err='Введите сумму покупки';return renderSheet()}
      const bal=accBal(S.accounts.find(a=>a.id===f.acc)||{bal0:0});
      if(amt>bal&&UI.confirm!=='buy'){UI.confirm='buy';f.err='На этом счёте '+fmt(bal)+', этого не хватит. Нажми ещё раз, чтобы списать всё равно.';return renderSheet()}
      const g=S.goals.find(x=>x.id===UI.sheet.id);closeGoal(UI.sheet.id,{amount:amt,acc:f.acc,cat:f.cat});UI.sheet=null;commit();toast('Куплено: '+(g?g.name:''));break}
    case 'data':UI.form={name:S.name,pet:(S.pet&&S.pet.name)||'Уголёк',import:'',err:''};openSheet('data');break;
    case 'namesave':S.name=(UI.form.name||'').trim()||'Странник';if(!S.pet)S.pet={food:0,xp:0,fedOn:null,name:'Уголёк'};S.pet.name=(UI.form.pet||'').trim()||'Уголёк';save();render();toast('Имена сохранены');break;
    case 'copy':{S.lastBackup=today();save();const txt=JSON.stringify(S);const sel=()=>{const t=$('#dx');if(t){t.focus();t.select()}toast('Выдели и скопируй текст вручную')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Копия в буфере обмена')).catch(sel)}catch(e){sel()}break}
    case 'import':{const raw=(UI.form.import||'').trim();try{const o=JSON.parse(raw);if(!o||!Array.isArray(o.tx)||!Array.isArray(o.accounts)||!o.accounts.length)throw 0;
      const d=defaults();S=Object.assign(d,o,{streak:Object.assign(d.streak,o.streak||{}),onboarded:true,tourSeen:true,questInit:false});syncQuest();UI.sheet=null;commit();toast('Данные восстановлены')}
      catch(e){UI.form.err='Не получилось прочитать копию. Проверь, что вставлен весь текст';renderSheet()}break}
    case 'reset':if(UI.confirm!=='reset'){UI.confirm='reset';renderSheet()}else{S=defaults();UI.sheet=null;UI.confirm=null;save();start()}break;
    case 'onboard':{const f=UI.form;S.name=(f.name||'').trim()||'Странник';
      S.accounts=[{id:uid(),name:'Наличные',type:'cash',bal0:num(f.cash)},{id:uid(),name:'Карта',type:'card',bal0:num(f.card)}];S.lastAcc=S.accounts[1].id;S.onboarded=true;S.questInit=true;UI.sheet=null;commit();toast('Добро пожаловать, '+S.name);startTour();break}
  }}
document.addEventListener('click',e=>{
  const sc=e.target;if(sc.classList&&sc.classList.contains('scrim')&&sc.dataset.lock!=='1'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(S.sound&&S.sound.music&&!SND.timer)musicSync();
  if(['music','sfxtoggle','musictoggle'].indexOf(el.dataset.act)<0)playSfx('tap');
  act(el.dataset.act,el)});
document.addEventListener('visibilitychange',()=>{try{if(!SND.ctx)return;if(document.hidden)SND.ctx.suspend();else if(S.sound&&(S.sound.music||S.sound.sfx))SND.ctx.resume()}catch(e){}});
window.addEventListener('resize',()=>{if(UI.tour!=null)drawTour()});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset&&t.dataset.snd==='vol'){S.sound.vol=t.value/100;if(SND.master)SND.master.gain.value=S.sound.vol;save();return}
  if(!t.dataset||!t.dataset.f)return;const f=curF();f[t.dataset.f]=t.value});
document.addEventListener('keydown',e=>{try{if(e.key==='Enter'&&UI.sheet&&UI.sheet.kind==='add'&&e.target&&e.target.id==='amt'){e.preventDefault();saveTxForm()}}catch(x){}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.file){readStatementFile(t.files&&t.files[0]);return}
  if(t.dataset&&t.dataset.mk&&UI.form&&UI.form.map){UI.form.map[t.dataset.mk]=t.value;return}
  if(t.dataset&&t.dataset.snd==='vol'){playSfx('coin');return}
  if(!t.dataset||!t.dataset.f)return;const f=curF();f[t.dataset.f]=t.value});

function start(){cloudSync(boot)}
function tgInit(){try{const w=window.Telegram&&window.Telegram.WebApp;if(!w||!w.initData)return;w.ready();w.expand();try{w.setHeaderColor('#15121b');w.setBackgroundColor('#15121b')}catch(e){}}catch(e){}}
function boot(){tgInit();S=load();if(S.onboarded)syncQuest();UI.pct=curPct();UI.tab='home';render();
  if(!S.onboarded){UI.form={name:S.name,cash:'',card:''};openSheet('onboard')}else renderSheet();
  if(S.onboarded){checkAch();if(notes.length)commit()}
  maybeTour();
  if(saveFailed)toast('Браузер не даёт сохранять данные. Сделай резервную копию')}
function showFatal(e){let raw='';try{raw=localStorage.getItem(KEY)||''}catch(x){}
  const a=document.getElementById('app');if(!a)return;
  a.innerHTML='<section class="card"><h2>Ошибка запуска</h2><p class="sub">'+esc(e&&e.message?e.message:e)+'</p>'
   +'<p class="sub">Данные не тронуты. Скопируй текст ниже и пришли разработчику, если нужна помощь.</p><textarea class="inp" readonly style="margin-top:10px">'+esc(raw)+'</textarea>'
   +'<button class="btn ghost" style="margin-top:10px;width:100%" id="safe">Открыть без обучения и бонусов</button></section>';
  const b=document.getElementById('safe');if(b)b.onclick=()=>{try{const o=JSON.parse(raw||'{}');o.tourSeen=true;o.questHidden=true;localStorage.setItem(KEY,JSON.stringify(o))}catch(x){}try{start()}catch(x2){showFatal(x2)}}}
try{start()}catch(e){showFatal(e)}
</script>
</body></html>
